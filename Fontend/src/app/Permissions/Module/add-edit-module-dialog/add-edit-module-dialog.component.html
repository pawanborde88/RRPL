<h2 mat-dialog-title>{{ isEditMode ? 'Edit Module' : 'Add Module' }}</h2>

<mat-dialog-content>
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="dialog-form">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Module Name</mat-label>
        <input matInput formControlName="module_name" />
      </mat-form-field>

      <mat-form-field
        *ngIf="!isEditMode"
        appearance="outline"
        class="full-width"
      >
        <mat-label>Parent Module</mat-label>
        <mat-select formControlName="parent_module">
          <mat-option [value]="">None</mat-option>
          <mat-option
            *ngFor="let item of modulesList"
            [value]="item.module_id"
          >
            {{ item.module_name }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Status</mat-label>
        <mat-select formControlName="active_status_id">
          <mat-option [value]="1">Active</mat-option>
          <mat-option [value]="2">Inactive</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Description</mat-label>
        <textarea matInput formControlName="description" rows="3"></textarea>
      </mat-form-field>
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button
    mat-raised-button
    color="primary"
    [disabled]="form.invalid || loadingState"
    (click)="onSubmit()"
  >
    {{ isEditMode ? 'Update' : 'Add' }}
  </button>
</mat-dialog-actions>
