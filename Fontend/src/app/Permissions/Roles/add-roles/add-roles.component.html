
<h2 mat-dialog-title>{{ data.title }}
  <button mat-icon-button mat-dialog-close style="position: absolute; top: 10px; right: 12px;">
    <mat-icon>close</mat-icon>
  </button>
</h2>

<mat-dialog-content class="mat-typography">
  <form [formGroup]="addPermissionForm" (ngSubmit)="onSubmit()">
    <div class="row mt-1">
      <mat-form-field appearance="outline"  class="col-md-4">
        <mat-label>Role Name</mat-label>
        <input matInput formControlName="role_name">
      </mat-form-field> 
      <mat-form-field appearance="outline" class="col-md-4">
        <mat-label>Status</mat-label>
        <mat-select formControlName="active_status_id">
          <mat-option value="1">Active</mat-option>
          <mat-option value="2">Inactive</mat-option>
        </mat-select>
      </mat-form-field>
      <mat-form-field appearance="outline" class="col-md-4">
        <mat-label>Description</mat-label>
        <textarea matInput formControlName="description"></textarea>
      </mat-form-field>
    </div>

    <mat-dialog-actions align="end">
      <button mat-button mat-dialog-close>Cancel</button>
      <button color="primary" type="submit" [disabled]="addPermissionForm.invalid" mat-raised-button>
        {{ data.rowData ? 'Update' : 'Add' }}
      </button>
    </mat-dialog-actions>
  </form>
</mat-dialog-content>
