<div class="flex flex-col w-full h-[calc(100vh-250px)] min-h-[500px] max-h-[800px] transition-opacity duration-200"
  [class.opacity-60]="isLoading()" [class.pointer-events-none]="isLoading()">

  <!-- Header Row with Search and Buttons -->
  <div
    class="flex flex-row items-center justify-between gap-4 bg-gradient-to-r from-gray-50 to-gray-100 border-b border-gray-200 px-4 py-3 shadow-sm">

    <!-- Quick Filter Search -->
    <div class="flex flex-row items-center gap-3 flex-1 min-w-0">
      <div class="relative flex-1 max-w-md group">
        <!-- Search Icon -->
        <div class="absolute left-3 top-1/2 transform -translate-y-1/2 pointer-events-none z-10">
          <mat-icon
            class="text-gray-400 group-focus-within:text-blue-500 transition-colors duration-200 text-lg">search</mat-icon>
        </div>
        <input #searchInput type="text" placeholder="Search (Press Enter to apply)" (keydown.enter)="onSearchEnter()"
          class="w-full pl-10 pr-10 py-2 text-sm border border-gray-300 rounded-lg 
                      bg-white text-gray-900 placeholder-gray-400
                      focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-1 focus:border-blue-500 
                      transition-all duration-200
                      hover:border-gray-400
                      shadow-sm" />
        <!-- Clear Button -->
        <button *ngIf="facade.searchText()" type="button" (click)="clearSearch()" class="absolute right-2 top-1/2 transform -translate-y-1/2 
                       p-1.5 rounded-full
                       text-gray-400 hover:text-gray-700 hover:bg-gray-100 
                       focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-1
                       transition-all duration-200
                       active:scale-95" aria-label="Clear search">
          <mat-icon class="text-lg leading-none">clear</mat-icon>
        </button>
      </div>
    </div>

    <!-- Header Buttons -->
    <div class="flex flex-row items-center gap-2 flex-shrink-0">
      <!-- Custom Actions -->
      @if (visibleHeaderButtons().length > 0) {
      @for (button of visibleHeaderButtons(); track button.label) {
      <button mat-raised-button [color]="button.color || 'primary'"
        [disabled]="button.disabled ? button.disabled() : false" (click)="button.action()"
        class="!h-9 !px-4 !text-sm font-medium shadow-sm hover:shadow-md transition-shadow duration-200">
        @if (button.icon) {
        <mat-icon class="!text-lg !leading-none mr-1.5">{{ button.icon }}</mat-icon>
        }
        <span>{{ button.label }}</span>
      </button>
      }
      }

      <!-- Export Button -->
      @if (canExport()) {
      <button matTooltip="Export Data" mat-icon-button color="primary" (click)="exportData()">
        <mat-icon>arrow_circle_down</mat-icon>
      </button>
      }
    </div>
  </div>

  <!-- AG Grid Container -->
  <div class="flex-1 w-full min-h-[600px] overflow-hidden bg-white border border-gray-200 border-t-0">
    <!-- AG Grid with Performance Optimizations -->
    <ag-grid-angular class="w-full h-full" [columnDefs]="columnDefs()" [defaultColDef]="defaultColDef()"
      [rowData]="rowModelType() === 'clientSide' ? facade.allLoadedData() : null" [rowBuffer]="rowBuffer"
      [animateRows]="animateRows()" [rowModelType]="rowModelType()" [cacheBlockSize]="effectiveCacheBlockSize()"
      [maxConcurrentDatasourceRequests]="maxConcurrentDatasourceRequests()"
      [infiniteInitialRowCount]="infiniteInitialRowCount()" [maxBlocksInCache]="maxBlocksInCache()"
      [rowHeight]="rowHeight()" [floatingFiltersHeight]="floatingFiltersHeight()" [theme]="theme()"
      [loading]="isLoading()" [autoGroupColumnDef]="autoGroupColumnDef()" [autoSizeStrategy]="autoSizeStrategy"
      [rowSelection]="rowSelection()" [selectionColumnDef]="selectionColumnDef()" [getRowId]="getRowId()"
      [suppressRowClickSelection]="suppressRowClickSelection()" [getRowClass]="effectiveGetRowClass()"
      [getRowStyle]="getRowStyle()" [pinnedBottomRowData]="pinnedBottomRowData()" [pagination]="true"
      [paginationPageSize]="paginationPageSize()" [paginationPageSizeSelector]="paginationPageSizeSelector()"
      [paginationNumberFormatter]="paginationNumberFormatter" [enableCellTextSelection]="enableCellTextSelection()"
      [domLayout]="domLayout" (gridReady)="onGridReady($event)" (selectionChanged)="onSelectionChanged()"
      (filterChanged)="onFilterChanged()" (paginationChanged)="onPaginationChanged()">

    </ag-grid-angular>
  </div>
</div>
