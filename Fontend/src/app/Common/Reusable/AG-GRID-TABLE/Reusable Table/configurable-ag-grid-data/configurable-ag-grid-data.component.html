<div
  class="ag-grid-root flex flex-col w-full h-[calc(100vh-250px)] min-h-[500px] max-h-[800px] transition-opacity duration-200"
  [class.opacity-60]="isLoading()" [class.pointer-events-none]="isLoading()" [class.full-view]="isFullView()">

  <!-- Header Row with Search and Buttons -->
  <div
    class="flex flex-row items-center justify-between gap-4 bg-gradient-to-r from-gray-50 to-gray-100 border-b border-gray-200 px-4 py-3 shadow-sm">

    <!-- Quick Filter Search -->
    <div class="flex flex-row items-center gap-3 flex-1 min-w-0">
      <div class="relative flex-1 max-w-md group">
        <!-- Search Icon -->
        <div class="absolute left-3 top-1/2 transform -translate-y-1/2 pointer-events-none z-10">
          <mat-icon
            class="text-gray-400 group-focus-within:text-blue-500 transition-colors duration-200 text-lg">search</mat-icon>
        </div>
        <input #searchInput type="text" [value]="facade.searchText()" placeholder="Search (Press Enter to apply)"
          (keydown.enter)="onSearchEnter()" class="w-full pl-10 pr-10 py-2 text-sm border border-gray-300 rounded-lg 
                      bg-white text-gray-900 placeholder-gray-400
                      focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-1 focus:border-blue-500 
                      transition-all duration-200
                      hover:border-gray-400
                      shadow-sm" />
        <!-- Clear Button -->
        <button *ngIf="facade.searchText()" type="button" (click)="clearSearch()" class="absolute right-2 top-1/2 transform -translate-y-1/2 
                       p-1.5 rounded-full
                       text-gray-400 hover:text-gray-700 hover:bg-gray-100 
                       focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-1
                       transition-all duration-200
                       active:scale-95" aria-label="Clear search">
          <mat-icon class="text-lg leading-none">clear</mat-icon>
        </button>
      </div>
    </div>

    <!-- Header Buttons -->
    <div class="flex flex-row items-center gap-2 flex-shrink-0">
      <!-- Custom Actions -->
      @if (visibleHeaderButtons().length > 0) {
      @for (button of visibleHeaderButtons(); track button.label) {
      <button mat-raised-button [color]="button.color || 'primary'"
        [disabled]="button.disabled ? button.disabled() : false" (click)="button.action()"
        class="!h-9 !px-4 !text-sm font-medium shadow-sm hover:shadow-md transition-shadow duration-200">
        @if (button.icon) {
        <mat-icon class="!text-lg !leading-none mr-1.5">{{ button.icon }}</mat-icon>
        }
        <span>{{ button.label }}</span>
      </button>
      }
      }

      <!-- Full View Table Button -->


      <!-- Export Button -->
      @if (canExport()) {
      <button matTooltip="Export Data" mat-icon-button color="primary" (click)="exportData()">
        <mat-icon>arrow_circle_down</mat-icon>
      </button>
      }
      @if (this.facade.hasData()) {
      <button matTooltip="Full view" mat-icon-button color="primary" (click)="toggleFullView()">
        <mat-icon>{{ isFullView() ? 'fullscreen_exit' : 'fullscreen' }}</mat-icon>
      </button>
      }

      <!-- Settings Menu -->
      <button mat-icon-button [matMenuTriggerFor]="settingsMenu" matTooltip="Grid Settings">
        <mat-icon>settings</mat-icon>
      </button>
      <mat-menu #settingsMenu="matMenu">
        <button mat-menu-item [matMenuTriggerFor]="columnsMenu">
          <mat-icon>view_column</mat-icon>
          <span>Select Columns</span>
        </button>
        <button mat-menu-item (click)="resetColumnState()">
          <mat-icon>restart_alt</mat-icon>
          <span>Reset Column Layout</span>
        </button>

      </mat-menu>

      <!-- Columns Submenu -->
      <mat-menu #columnsMenu="matMenu" class="column-selection-menu">
        <div class="px-2 py-1 border-b border-gray-100 bg-gray-50/95 backdrop-blur-md sticky top-0 z-10 w-48"
          (click)="$event.stopPropagation()">
          <div class="flex items-center justify-between mb-1">
            <span class="text-[5.5px] font-bold text-gray-500  tracking-tighter">Select Column</span>
            <span class="text-[8px] px-1 bg-blue-50 text-blue-600 rounded font-bold border border-blue-100">
              {{gridColumns().length}}
            </span>
          </div>
          <div class="relative group">
            <mat-icon
              class="absolute left-1.5 top-1/2 -translate-y-1/2 !text-[10px] !w-auto !h-auto text-gray-400 group-focus-within:text-blue-500 transition-colors">search</mat-icon>
            <input #colSearch type="text" placeholder="Find..." (input)="onColumnSearch(colSearch.value)" class="w-full pl-5 pr-1 py-0.5 text-[9.5px] bg-white border border-gray-200 rounded-sm 
                     focus:outline-none focus:ring-2 focus:ring-blue-500/10 focus:border-blue-500/30 
                     placeholder-gray-400 transition-all duration-200 shadow-none" />
          </div>
        </div>

        <div class="max-h-[260px] overflow-y-auto py-0 w-48 scroll-smooth custom-scrollbar">
          @for (col of filteredGridColumns(); track col.id) {
          <button mat-menu-item (click)="toggleColumn(col.id); $event.stopPropagation()"
            class="!h-6 !leading-6 !min-h-[24px] px-2 hover:bg-blue-50/30 transition-all duration-100 group border-l-2 border-transparent hover:border-blue-500 overflow-hidden">
            <div class="flex items-center justify-between gap-1.5 w-full">
              <div class="flex items-center gap-1.5 min-w-0">
                <!-- Custom Checkbox Look -->
                <div class="flex items-center justify-center w-3 h-3 rounded-sm border transition-all duration-100"
                  [class.bg-blue-600]="col.visible" [class.border-blue-600]="col.visible"
                  [class.border-gray-300]="!col.visible" [class.bg-white]="!col.visible">
                  @if (col.visible) {
                  <mat-icon
                    class="text-white !text-[8.5px] !w-auto !h-auto animate-in zoom-in-75 duration-100">check</mat-icon>
                  }
                </div>
                <span class="text-[11px] truncate transition-all duration-100" [class.text-blue-900]="col.visible"
                  [class.text-gray-600]="!col.visible" [class.font-medium]="col.visible">
                  {{ col.name }}
                </span>
              </div>
              @if (col.visible) {
              <div
                class="w-1 h-1 rounded-full bg-blue-500/80 opacity-0 group-hover:opacity-100 transition-all duration-100">
              </div>
              }
            </div>
          </button>
          } @empty {
          <div class="px-2 py-4 text-center">
            <p class="text-[9px] font-medium text-gray-400 italic">No Match</p>
          </div>
          }
        </div>
      </mat-menu>
    </div>
  </div>

  <!-- AG Grid Container -->
  <div class="flex-1 w-full min-h-[600px] relative overflow-hidden bg-white border border-gray-200 border-t-0">

    <!-- Skeleton Loader -->


    <!-- AG Grid with Performance Optimizations -->
    <ag-grid-angular class="w-full h-full" [columnDefs]="columnDefs()" [defaultColDef]="defaultColDef()"
      [rowData]="rowModelType() === 'clientSide' ? facade.allLoadedData() : null" [rowBuffer]="rowBuffer"
      [valueCache]="valueCache" [suppressColumnVirtualisation]="suppressColumnVirtualisation"
      [animateRows]="animateRows()" [rowModelType]="rowModelType()" [cacheBlockSize]="effectiveCacheBlockSize()"
      [maxConcurrentDatasourceRequests]="maxConcurrentDatasourceRequests()"
      [infiniteInitialRowCount]="infiniteInitialRowCount()" [maxBlocksInCache]="maxBlocksInCache()"
      [rowHeight]="rowHeight()" [floatingFiltersHeight]="floatingFiltersHeight()" [theme]="theme()"
      [loading]="isLoading()" [autoGroupColumnDef]="autoGroupColumnDef()" [autoSizeStrategy]="autoSizeStrategy"
      [rowSelection]="rowSelection()" [selectionColumnDef]="effectiveSelectionColumnDef()"
      [getRowId]="effectiveGetRowId()" [suppressRowClickSelection]="suppressRowClickSelection()"
      [getRowClass]="effectiveGetRowClass()" [getRowStyle]="effectiveGetRowStyle()"
      [pinnedBottomRowData]="pinnedBottomRowData()" [pagination]="true" [paginationPageSize]="paginationPageSize()"
      [paginationPageSizeSelector]="paginationPageSizeSelector()"
      [paginationNumberFormatter]="paginationNumberFormatter" [enableCellTextSelection]="enableCellTextSelection()"
      [domLayout]="domLayout" [context]="gridContext()" (gridReady)="onGridReady($event)"
      (selectionChanged)="onSelectionChanged()" (filterChanged)="onFilterChanged()"
      (paginationChanged)="onPaginationChanged()" (columnMoved)="onColumnChanged()" (columnResized)="onColumnChanged()"
      (columnVisible)="onColumnChanged()" (sortChanged)="onColumnChanged()"
      (asyncTransactionsFlushed)="onColumnChanged()">


    </ag-grid-angular>
  </div>
</div>
