<!-- custom-loading.component.html -->
<div *ngIf="loading()" @fadeIn role="alert" aria-live="assertive" [attr.aria-label]="ariaLabel()"
  [ngClass]="isFullScreen() ? 'fixed inset-0 z-[9999]' : 'absolute inset-0 z-[1000]'"
  class="flex flex-col items-center justify-center bg-white/80 backdrop-blur-md"
  [style.width]="isFullScreen() ? '100vw' : 'var(--table-content-width, 100%)'"
  [style.height]="isFullScreen() ? '100vh' : '100%'">
  <div class="flex flex-col items-center gap-4">
    <!-- Modern Spinner -->
    <div class="relative">
      <span class="loader"></span>
    </div>

    <!-- Loading Text with Animation -->
    <div class="flex items-center gap-1 text-gray-700 font-medium text-base">
      <span>{{ text() || 'Loading data' }}</span>
    </div>
  </div>
</div>
