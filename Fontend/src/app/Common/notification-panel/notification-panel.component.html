<div
    class="w-[260px] md:w-[280px] bg-white border border-slate-200/60 shadow-[0_20px_50px_-12px_rgba(0,0,0,0.15)] rounded-2xl overflow-hidden flex flex-col max-h-[400px] transition-all duration-300">

    <!-- Unified Header & Tabs -->
    <div class="px-3 py-2 bg-slate-50 border-b border-slate-100">
        <div class="flex items-center justify-between mb-1.5">
            <h5 class="text-[5px] font-bold text-slate-400 uppercase tracking-widest"> Notifications</h5>
            <button (click)="markAllAsRead()"
                class="text-blue-600 hover:text-blue-700 text-[10px] font-bold transition-colors">
                Mark all read
            </button>
        </div>
        <div class="flex gap-1 bg-white p-1 rounded-xl border border-slate-200/40">
            <button (click)="setActiveTab('all')" class="flex-1 py-1 rounded-lg text-[10px] font-bold transition-all"
                [ngClass]="activeTab() === 'all' ? 'bg-slate-900 text-white shadow-sm' : 'text-slate-500 hover:bg-slate-50'">
                All Activity
            </button>
            <button (click)="setActiveTab('unread')"
                class="flex-1 py-1 rounded-lg text-[10px] font-bold transition-all flex items-center justify-center gap-2"
                [ngClass]="activeTab() === 'unread' ? 'bg-slate-900 text-white shadow-sm' : 'text-slate-500 hover:bg-slate-50'">
                Unread
                @if (unreadCount() > 0) {
                <span class="px-1.5 bg-blue-500 text-white rounded-md text-[8px] leading-tight py-0.5 font-bold">{{
                    unreadCount() }}</span>
                }
            </button>
        </div>
    </div>

    <!-- Content -->
    <div class="flex-1 overflow-y-auto custom-scrollbar bg-white">
        @if (filteredNotifications().length > 0) {
        @for (note of filteredNotifications(); track note.id) {
        <div class="relative px-3 py-2.5 transition-all duration-300 hover:bg-slate-50/80 cursor-pointer group flex gap-2.5 border-b border-slate-50 last:border-0"
            matRipple>

            <!-- Status Indicator -->
            <div class="flex-shrink-0 w-1 pt-1.5">
                @if (note.unread) {
                <div class="w-1.5 h-1.5 bg-blue-500 rounded-full shadow-[0_0_8px_rgba(59,130,246,0.5)]"></div>
                }
            </div>

            <!-- Icon Container -->
            <div class="flex-shrink-0 w-7 h-7 rounded-lg flex items-center justify-center shadow-sm border border-white"
                [ngClass]="note.iconBg">
                <mat-icon [ngClass]="note.iconColor"
                    class="!text-[14px] !w-3.5 !h-3.5 !flex !items-center !justify-center">{{ note.icon }}</mat-icon>
            </div>

            <!-- Text Content -->
            <div class="flex-1 min-w-0">
                <div class="flex items-baseline justify-between gap-1 mb-0.5">
                    <h5
                        class="text-[11px] font-bold text-slate-800 truncate leading-tight group-hover:text-blue-600 transition-colors">
                        {{ note.title }}</h5>
                    <span class="text-[8px] text-slate-400 font-bold whitespace-nowrap">{{ note.time }}</span>
                </div>
                <p class="text-[10px] text-slate-500 leading-normal line-clamp-2 font-medium">{{ note.description }}</p>
            </div>

            <!-- Delete (On Hover) -->
            <button (click)="deleteNotification(note.id, $event)"
                class="absolute right-2 top-2 opacity-0 group-hover:opacity-100 w-6 h-6 rounded-lg flex items-center justify-center text-slate-300 hover:text-red-500 hover:bg-red-50 transition-all">
                <mat-icon class="!text-[12px] !w-3 !h-3">close</mat-icon>
            </button>
        </div>
        }
        } @else {
        <div class="flex flex-col items-center justify-center py-10 px-5 text-center">
            <div class="w-12 h-12 bg-slate-100 rounded-full flex items-center justify-center mb-3">
                <mat-icon class="text-slate-300">notifications_off</mat-icon>
            </div>
            <p class="text-[11px] font-bold text-slate-400 uppercase tracking-widest">No new notifications</p>
        </div>
        }
    </div>
</div>
