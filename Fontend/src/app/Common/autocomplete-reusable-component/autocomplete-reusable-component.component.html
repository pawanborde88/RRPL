<mat-form-field appearance="outline" class="w-100">
  <mat-label>
    {{ placeholder }}
    <span *ngIf="isRequired">*</span>
  </mat-label>

  <mat-select [formControl]="selectedCtrl" [placeholder]="placeholder" [multiple]="isMultiSelect"
    (selectionChange)="onSelectionChange($event)">

    <mat-option class="contains-mat-select-search" disabled="true">
      <ngx-mat-select-search [formControl]="searchCtrl" (input)="onInputChange($event)" placeholderLabel="Search">
      </ngx-mat-select-search>
    </mat-option>

    <mat-option *ngIf="showSelectAll()" [value]="selectAllValue" (onSelectionChange)="toggleSelectAll($event)">
      Select All
    </mat-option>

    <mat-option *ngIf="filteredOptions().length === 0" disabled>
      No data available
    </mat-option>

    <mat-option *ngFor="let option of filteredOptions(); trackBy: trackByOptionId" [value]="getOptionValue(option)"
      [disabled]="option.disabled">
      {{ getOptionDisplay(option) }}
    </mat-option>
  </mat-select>

  <mat-error *ngIf="ngControl?.control?.touched && ngControl?.control?.errors?.['required']">
    {{ placeholder }} is required
  </mat-error>

  <!-- <mat-icon *ngIf="hasSelectedValue() && !disabled" matSuffix class="clear-icon" (click)="clearSelection($event)">
    close
  </mat-icon> -->
</mat-form-field>
