<!-- pagination.component.html -->
<div class="paginator-wrapper">
  <div class="paginator-container" [class.loading]="loadingState" role="navigation" aria-label="Pagination navigation">
    <div class="paginator-controls">
      <!-- Enhanced page size selector -->
      <div class="page-size-selector">
        <!-- <span class="selector-label">Items per page:</span> -->
        <div class="custom-select">
          <select [ngModel]="pageSize" (ngModelChange)="onPageSizeChange($event)" aria-label="Select items per page">
            <option *ngFor="let size of pageSizeOptions" [value]="size">
              {{ size === 'All' ? ' All' : size }}
            </option>
          </select>
          <mat-icon class="dropdown-icon">arrow_drop_down</mat-icon>
        </div>
      </div>

      <!-- Enhanced range information with loading indicator -->
      <div class="range-info" role="status" aria-live="polite">
        <span class="current-range">{{ startItem }}-{{ endItem }}</span>
        <span class="total-items">of {{ filteredCount }}</span>
        <mat-spinner *ngIf="loadingState" diameter="16" strokeWidth="2" class="loading-spinner"></mat-spinner>
      </div>

      <!-- Enhanced navigation buttons -->
      <div class="navigation-buttons">
        <button mat-icon-button class="nav-button first-page" (click)="onPageChange(1)"
          [disabled]="currentPage === 1 || loadingState" matTooltip="First page" aria-label="Go to first page">
          <mat-icon>first_page</mat-icon>
        </button>

        <button mat-icon-button class="nav-button prev-page" [disabled]="currentPage === 1 || loadingState"
          (click)="onPageChange(currentPage - 1)" matTooltip="Previous page" aria-label="Go to previous page">
          <mat-icon>chevron_left</mat-icon>
        </button>

        <!-- Enhanced page numbers with better accessibility -->
        <div class="page-numbers" role="group" aria-label="Page numbers">
          <ng-container *ngFor="let page of pages; let i = index">
            <button mat-mini-fab *ngIf="isNumber(page)" [color]="page === currentPage ? 'primary' : ''"
              [class.current]="page === currentPage" class="page-button" (click)="onPageChange(page)"
              [disabled]="loadingState" [attr.aria-current]="page === currentPage ? 'page' : null"
              [attr.aria-label]="'Go to page ' + page">
              {{ page }}
            </button>
            <span *ngIf="!isNumber(page)" class="ellipsis" aria-hidden="true">•••</span>
          </ng-container>
        </div>

        <button mat-icon-button class="nav-button next-page" [disabled]="currentPage === totalPages || loadingState"
          (click)="onPageChange(currentPage + 1)" matTooltip="Next page" aria-label="Go to next page">
          <mat-icon>chevron_right</mat-icon>
        </button>

        <button mat-icon-button class="nav-button last-page" [disabled]="currentPage === totalPages || loadingState"
          (click)="onPageChange(totalPages)" matTooltip="Last page" aria-label="Go to last page">
          <mat-icon>last_page</mat-icon>
        </button>
      </div>
    </div>
  </div>
</div>
