<h6 mat-dialog-title class="dialog-title relative">
  <div class="flex min-w-0 items-center gap-2">
    <mat-icon class="title-icon text-base text-slate-200">{{ icon }}</mat-icon>
    <span class="truncate text-base font-semibold normal-case tracking-normal">{{ data.title | titlecase }}</span>
  </div>
  <button mat-icon-button mat-dialog-close style="position: absolute; top: 10px; right: 12px;">
    <mat-icon>close</mat-icon>
  </button>
</h6>

<mat-dialog-content class="m-0 max-h-[70vh] overflow-y-auto bg-gray-50 p-0">
  <div class="space-y-5 p-6">


    <!-- Value Display Section -->
    <div class="space-y-3">


      <div class="relative rounded-xl border border-gray-300 bg-white p-4 shadow-sm">
        <div class="overflow-x-auto" *ngIf="!isEmpty">
          <code class=" text-sm text-gray-800 whitespace-pre-wrap break-all">
            {{ displayValue }}
          </code>
        </div>
        <div class="flex items-center justify-center py-4" *ngIf="isEmpty">
          <p class="text-sm text-gray-500 italic">No {{ data.title | lowercase }} found</p>
        </div>
        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center" *ngIf="!isEmpty">
          <div class="h-full w-8 bg-gradient-to-l from-white"></div>
        </div>
      </div>


    </div>




  </div>
</mat-dialog-content>

<mat-dialog-actions align="end" class="!px-6 !pb-6">
  <button mat-stroked-button color="primary" [cdkCopyToClipboard]="rawValue" (cdkCopyToClipboardCopied)="onCopied()">
    <mat-icon>{{ isCopied ? 'done_all' : 'content_copy' }}</mat-icon>
    {{ isCopied ? 'Copied' : 'Copy' }}
  </button>
</mat-dialog-actions>
