<h2 mat-dialog-title>
  {{ data.title }}
  <button mat-icon-button mat-dialog-close aria-label="Close dialog" class="close-button">
    <mat-icon>close</mat-icon>
  </button>
</h2>

<div mat-dialog-content>
  <!-- Loading state -->
  <div *ngIf="isLoading" class="loading-container">
    <mat-spinner diameter="40"></mat-spinner>
    <p class="loading-text">Loading preview...</p>
  </div>

  <!-- Error state -->
  <div *ngIf="hasError" class="error-container">
    <mat-icon color="warn">error_outline</mat-icon>
    <p>{{ errorMessage }}</p>
    <button mat-raised-button color="primary" (click)="downloadFile()" [disabled]="isDownloading">
      <mat-icon>{{ isDownloading ? 'hourglass_empty' : 'download' }}</mat-icon>
      {{ isDownloading ? 'Downloading...' : 'Download File Instead' }}
    </button>
  </div>
  <!-- Content Controls -->
  <div class="preview-controls" *ngIf="!isLoading && !hasError && (isImage || isPdf)">
    <button mat-icon-button matTooltip="Zoom In" (click)="zoomIn()" type="button">
      <mat-icon>zoom_in</mat-icon>
    </button>
    <button mat-icon-button matTooltip="Zoom Out" (click)="zoomOut()" type="button">
      <mat-icon>zoom_out</mat-icon>
    </button>
    <button mat-icon-button matTooltip="Rotate Left" (click)="rotateLeft()" type="button">
      <mat-icon>rotate_left</mat-icon>
    </button>
    <button mat-icon-button matTooltip="Rotate Right" (click)="rotateRight()" type="button">
      <mat-icon>rotate_right</mat-icon>
    </button>
    <button mat-icon-button matTooltip="Reset" (click)="resetZoomAndRotation()" type="button">
      <mat-icon>restart_alt</mat-icon>
    </button>
  </div>

  <!-- PDF preview -->
  <div *ngIf="!isLoading && !hasError && isPdf" class="pdf-container">
    <div [style.transform]="getTransformStyle()" class="transform-wrapper">
      <iframe [src]="fileUrl" width="100%" height="500px" frameborder="0"></iframe>
    </div>
  </div>

  <!-- Image preview -->
  <div *ngIf="!isLoading && !hasError && isImage" class="image-container">
    <div [style.transform]="getTransformStyle()" class="transform-wrapper">
      <img [src]="data.fileUrl" alt="Receipt Image" (load)="isLoading = false"
        (error)="handleError('Failed to load image')" />
    </div>
  </div>

  <!-- Unsupported format -->
  <div *ngIf="!isLoading && !hasError && !isPdf && !isImage" class="unsupported-format">
    <mat-icon color="warn">description</mat-icon>
    <p>This file format is not supported for preview.</p>
    <p class="file-name">File: {{ fileName }}</p>
  </div>
</div>

<div mat-dialog-actions align="end">
  <button *ngIf="showDownloadButton" mat-raised-button color="primary" (click)="downloadFile()"
    [disabled]="isDownloading">
    <mat-icon>{{ isDownloading ? 'hourglass_empty' : 'download' }}</mat-icon>
    {{ isDownloading ? 'Downloading...' : (isPdf ? 'Download PDF' : 'Download Image') }}
  </button>
  <button mat-button mat-dialog-close>Close</button>
</div>
