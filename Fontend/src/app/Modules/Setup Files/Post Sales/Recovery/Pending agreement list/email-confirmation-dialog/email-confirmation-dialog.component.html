<h2 mat-dialog-title>Send Email Confirmation</h2>
<mat-dialog-content>
  <p>Are you sure you want to send an email to {{data.customerName}}?</p>
  <p>Email: {{data.customerEmail}}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onNoClick()">Cancel</button>
  <button mat-raised-button color="primary" (click)="confirmSend()" cdkFocusInitial>
    Send Email
  </button>
</mat-dialog-actions>
