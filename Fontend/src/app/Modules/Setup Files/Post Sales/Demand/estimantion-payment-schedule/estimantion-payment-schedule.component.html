<app-template>
    <app-breadcrumb>
        <li class="breadcrumb-item"><a routerLink="/"> Home</a></li>
        <li class="breadcrumb-item "> After Sales</li>
        <li class="breadcrumb-item "> Installment</li>

        <li class="breadcrumb-item active"> Stage wise Payments</li>
    </app-breadcrumb>
     <mat-card >

                <mat-card-content>
                    <form [formGroup]="addUnitBankerForm" class="row g-3 align-items-end">
                        <!-- PROJECT DETAILS -->
                        <div class="col-md-3">
                            <app-autocomplete-reusable-component [options]="projectsList" formControlName="project_id"
                                displayKey="property_name" idKey="project_id" placeholder="Select Project"
                                class="w-100">
                            </app-autocomplete-reusable-component>
                        </div>

                        <div class="col-md-3">
                            <mat-form-field appearance="outline" class="w-100">
                                <mat-label>Select Wing</mat-label>
                                <mat-select formControlName="wing_id">
                                    <mat-option *ngFor="let allwings of allWingslist" [value]="allwings.wing_id">
                                        {{ allwings.wing_name }}
                                    </mat-option>
                                </mat-select>
                            </mat-form-field>
                        </div>

                    </form>

                    <app-reusable-custom-table [loading]="loading" [dataSource]="dataSource"
                        [displayedColumns]="displayedColumns" [showCheckbox]="true"
                       [showFooter]="true"
                      >
                    </app-reusable-custom-table>
                </mat-card-content>
            </mat-card>
   
</app-template>
