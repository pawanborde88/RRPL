<app-template>
    <app-breadcrumb>
        <li class="breadcrumb-item ">After Sales</li>
        <li class="breadcrumb-item active"> Installment</li>

        <li class="breadcrumb-item active">Modify States</li>
    </app-breadcrumb>
    <mat-card class="mb-4">
        <mat-card-content>
            <form [formGroup]="addpaymentStages" class="row ">
                <!-- PROJECT DETAILS -->
                <div class="col-md-4">
                    <app-autocomplete-reusable-component [options]="projectsList" formControlName="project_id"
                        displayKey="property_name" idKey="project_id" placeholder="Select Project">
                    </app-autocomplete-reusable-component>
                </div>

                <div class="col-md-4">
                    <mat-form-field appearance="outline">
                        <mat-label>Select Wing</mat-label>
                        <mat-select formControlName="wing_id">
                            <mat-option *ngFor="let allwings of allWingslist" [value]="allwings.wing_id">
                                {{ allwings.wing_name }}
                            </mat-option>
                        </mat-select>
                    </mat-form-field>
                </div>



            </form>

            <app-reusable-custom-table [actions]="bookingActions" [headerButtons]="headerButtons" [loading]="loading"
                [dataSource]="dataSource" [displayedColumns]="bookingDisplayedColumns" [showFooter]="true">
            </app-reusable-custom-table>
        </mat-card-content>
    </mat-card>
</app-template>
