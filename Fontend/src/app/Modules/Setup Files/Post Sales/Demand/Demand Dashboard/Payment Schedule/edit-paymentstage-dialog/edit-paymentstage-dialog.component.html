<h2 mat-dialog-title>Edit Payment Stage</h2>
<mat-dialog-content>
    <form [formGroup]="addUpdateAgreementDetailsForm" enctype="multipart/form-data">
        <div class="form-container row mt-1">

            <mat-form-field appearance="outline" class="col-md-4">
                <mat-label>Payment Stage</mat-label>
                <input matInput formControlName="payment_stage" required>
                <mat-error *ngIf="addUpdateAgreementDetailsForm.get('payment_stage')?.hasError('required')">
                    Payment stage is required
                </mat-error>
            </mat-form-field>


            <mat-form-field appearance="outline" class="col-md-4">
                <mat-label>Status</mat-label>
                <mat-select formControlName="status" required>
                    <mat-option [value]="0">Not Completed</mat-option>
                    <mat-option [value]="1">Completed</mat-option>
                </mat-select>
                <mat-error *ngIf="addUpdateAgreementDetailsForm.get('status')?.hasError('required')">
                    Status is required
                </mat-error>
            </mat-form-field>

            <mat-form-field appearance="outline" class="col-md-4">
                <mat-label>Percentage</mat-label>
                <input matInput type="number" formControlName="percentage" min="0" max="100" required>
                <mat-icon matSuffix>percent</mat-icon>
                <mat-error *ngIf="addUpdateAgreementDetailsForm.get('percentage')?.hasError('required')">
                    Percentage is required
                </mat-error>
                <mat-error *ngIf="addUpdateAgreementDetailsForm.get('percentage')?.hasError('min')">
                    Minimum percentage is 0
                </mat-error>
                <mat-error *ngIf="addUpdateAgreementDetailsForm.get('percentage')?.hasError('max')">
                    Maximum percentage is 100
                </mat-error>
            </mat-form-field>

            <!-- Stage Date -->
            <mat-form-field appearance="outline" class="col-md-4">
                <mat-label>Stage Date</mat-label>
                <input matInput [matDatepicker]="stageDatePicker" formControlName="stage_date" required>
                <mat-datepicker-toggle matSuffix [for]="stageDatePicker"></mat-datepicker-toggle>
                <mat-datepicker #stageDatePicker></mat-datepicker>
                <mat-error *ngIf="addUpdateAgreementDetailsForm.get('stage_date')?.hasError('required')">
                    Stage date is required
                </mat-error>
            </mat-form-field>
            <mat-form-field appearance="outline" class="col-md-4">
                <mat-label>Actual Date</mat-label>
                <input matInput [matDatepicker]="actualDatePicker" formControlName="actual_date">
                <mat-datepicker-toggle matSuffix [for]="actualDatePicker"></mat-datepicker-toggle>
                <mat-datepicker #actualDatePicker></mat-datepicker>
            </mat-form-field>

            <div class="col-md-4">
                <mat-label>Site Work Progress</mat-label>
                <div class="d-flex align-items-center">
                    <input type="file" class="form-control" (change)="onFileSelected($event, 'site_work_progress')" />
                </div>
            </div>
            <div class="col-md-4">
                <mat-label>Architecture Letter</mat-label>
                <div class="d-flex align-items-center">
                    <input type="file" class="form-control" (change)="onFileSelected($event, 'architecture_letter')" />
                </div>
            </div>
        </div>
    </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
    <button mat-raised-button color="primary" (click)="onSave()"
        [disabled]="!addUpdateAgreementDetailsForm.valid || loading">
        <span *ngIf="!loading">Save</span>
        <mat-spinner *ngIf="loading" diameter="20"></mat-spinner>
    </button>
</mat-dialog-actions>
