<h2 mat-dialog-title>Add Approval WorkFlow </h2>
<mat-dialog-content>
    <form [formGroup]="approvalForm" class="container-fluid mt-1">
        <div class="row">
            <div class="col-md-6">
                <mat-form-field appearance="outline" class="w-100">
                    <mat-label>Select Approval</mat-label>
                    <input matInput formControlName="approval_level" required>
                    <mat-error *ngIf="approvalForm.get('approval_level')?.hasError('required')">
                        Approval level is required
                    </mat-error>
                </mat-form-field>
            </div>
            <div class="col-md-6">
                <mat-form-field appearance="outline" class="w-100">
                    <mat-label>Select Role</mat-label>
                    <mat-select formControlName="role_id" multiple>
                        <mat-option *ngFor="let roles of allRoleList" [value]="roles.role_id">
                            {{ roles.role }}
                        </mat-option>
                    </mat-select>
                </mat-form-field>
            </div>
            <div class="col-md-6">
                <mat-checkbox formControlName="is_highest">Is Highest</mat-checkbox>
            </div>
        </div>
    </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-raised-button color="primary" (click)="onConfirm()" [disabled]="approvalForm.invalid">Confirm</button>
</mat-dialog-actions>
