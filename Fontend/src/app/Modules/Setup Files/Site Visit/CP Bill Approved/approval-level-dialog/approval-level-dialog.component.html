<h2 mat-dialog-title>Change Approval Level</h2>
<mat-dialog-content>
  <form [formGroup]="approvalForm" class="container-fluid mt-1">
    <div class="row">
      <div class="col-md-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Select Approval Status</mat-label>
          <mat-select formControlName="approval_status_id" required>
            <mat-option [value]="1">Approved</mat-option>
            <mat-option [value]="2">Rejected</mat-option>
            <mat-option [value]="3">Pending</mat-option>
          </mat-select>
          <mat-error *ngIf="approvalForm.get('approval_status_id')?.hasError('required')">
            Approval status is required
          </mat-error>
        </mat-form-field>
      </div>

      <div class="col-md-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Select Level</mat-label>
          <mat-select formControlName="approval_level_id" required>
            <mat-option *ngFor="let level of approvelevelList" [value]="level.approval_level_id">  {{level.approval_level}}</mat-option>
          </mat-select>
          <mat-error *ngIf="approvalForm.get('approval_level_id')?.hasError('required')">
            Approval level is required
          </mat-error>
        </mat-form-field>
      </div>
    </div>

    <div class="row">
      <div class="col-md-12">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Reason</mat-label>
          <textarea matInput formControlName="remark" maxlength="500"></textarea>
          <mat-hint align="end">{{ approvalForm.get('remark')?.value?.length || 0 }}/500</mat-hint>
        </mat-form-field>
      </div>
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-raised-button color="primary" (click)="onConfirm()" [disabled]="approvalForm.invalid">Confirm</button>
</mat-dialog-actions>
