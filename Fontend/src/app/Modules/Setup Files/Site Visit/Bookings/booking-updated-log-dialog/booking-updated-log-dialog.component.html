<h2 mat-dialog-title>Booking Updated Log
    <!-- Close Button -->
    <button mat-icon-button mat-dialog-close style="position: absolute; top: 10px; right: 12px;">
        <mat-icon>close</mat-icon>
    </button>
</h2>

<mat-dialog-content>

    <app-configurable-ag-grid-data [columns]="columns" [apiEndpoint]="apiEndpoint" [apiMethod]="'POST'"
        [apiPayload]="payload()" [autoLoad]="true">
    </app-configurable-ag-grid-data>

</mat-dialog-content>
