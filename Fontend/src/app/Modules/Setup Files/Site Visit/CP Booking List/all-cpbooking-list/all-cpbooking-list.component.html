<mat-accordion>
  <mat-expansion-panel hideToggle [expanded]="true"> <mat-panel-title> Advanced Filters </mat-panel-title>

    <mat-expansion-panel-header>
      <mat-panel-title> Advanced Filters </mat-panel-title>
    </mat-expansion-panel-header>

    <form [formGroup]="bookingForm" class="w-100 g-3 align-items-end">
      <div class="row">
        <!-- Project Dropdown -->
        <div class="col-md-2">
          <app-autocomplete-reusable-component [options]="projectsList" formControlName="project_id"
            displayKey="property_name" [isMultiSelect]="true" idKey="project_id" placeholder="Select Project">
          </app-autocomplete-reusable-component>
        </div>

        <!-- Wing Dropdown -->
        <mat-form-field appearance="outline" class="col-md-2">
          <mat-label>Select Wing</mat-label>
          <mat-select formControlName="wing_id">
            <mat-option *ngFor="let allwings of allWingslist" [value]="allwings.wing_id">
              {{ allwings.wing_name }}
            </mat-option>
          </mat-select>
        </mat-form-field>
        <mat-form-field appearance="outline" class="col-md-2">
          <mat-label>Floor</mat-label>
          <mat-select formControlName="floor_id">
            <mat-option *ngFor="let floor of FloorUnitDropdown" [value]="floor.floor_id">
              {{ floor.floor_name }}
            </mat-option>
          </mat-select>
        </mat-form-field>

        <app-autocomplete-reusable-component [options]="allChannelPartnerList" class="col-md-2"
          formControlName="channel_partner_id" displayKey="full_name" idKey="channel_partner_id"
          placeholder="Select Partner Firm" (inputChanged)="onPartnerSearch($event)">
          <!-- event handler -->
        </app-autocomplete-reusable-component>

        <!-- Lead Date Range -->
        <div class="col-md-2">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Booking Date</mat-label>
            <mat-date-range-input [rangePicker]="leadDatePicker">
              <input matStartDate formControlName="start_date" placeholder="Start date">
              <input matEndDate formControlName="end_date" placeholder="End date">
            </mat-date-range-input>
            <mat-datepicker-toggle matIconSuffix [for]="leadDatePicker"></mat-datepicker-toggle>
            <mat-date-range-picker #leadDatePicker></mat-date-range-picker>
          </mat-form-field>
        </div>

        <!-- Apply Filter Button -->
        <div class="col-md-auto">
          <button mat-raised-button color="primary" class="d-flex align-items-center w-100"
            [disabled]="!bookingForm.get('project_id')?.value" (click)="fetchAllBookings()">
            <mat-icon class="me-1">filter_list</mat-icon> Apply Filter
          </button>
        </div>
      </div>
    </form>


  </mat-expansion-panel>
</mat-accordion>

<app-configurable-ag-grid-data [loading]="loading" [columns]="bookingBillsColumns" [apiEndpoint]="'fetch_all_bookings'"
  [apiMethod]="'POST'" [apiPayload]="getAgGridApiPayload()" [headerButtons]="headerButtons" [showCheckbox]="true"
  [cacheBlockSize]="100" [idProperty]="'booking_id'" [selectedItems]="selectedBooking"
  (rowSelected)="selectedBooking = $event" (checkboxChange)="onBookingSelectionChange($event.checked, $event.row)">
</app-configurable-ag-grid-data>
