<h2 mat-dialog-title>
  {{ data.title }}
  <button mat-icon-button mat-dialog-close style="position: absolute; top: 10px; right: 12px;">
    <mat-icon>close</mat-icon>
  </button>
</h2>

<mat-dialog-content class="mat-typography">
  <ng-container *ngIf="loading; else contentLoaded">
    <div class="loading-container">
      <mat-spinner diameter="50"></mat-spinner>
      <span>Loading revisit records...</span>
    </div>
  </ng-container>

  <ng-template #contentLoaded>
    <app-reusable-custom-table 
      *ngIf="(dataSource?.data?.length || 0) > 0; else noData"
      [loading]="loading"
      [dataSource]="dataSource" 
      [displayedColumns]="bookingDisplayedColumns" 
      [showCheckbox]="true"
      [showFooter]="true">
    </app-reusable-custom-table>

    <ng-template #noData>
      <div class="no-data-container">
        <mat-card class="no-data-card">
          <mat-card-content>
            <div class="text-center">
              <mat-icon class="no-data-icon">event_busy</mat-icon>
              <h4>No revisit history available</h4>
              <p class="text-muted">There are no previous revisit records for this booking</p>
            </div>
          </mat-card-content>
        </mat-card>
      </div>
    </ng-template>
  </ng-template>

  <div class="mt-3">
    <form [formGroup]="addSiteVisitForm" (ngSubmit)="onSubmit()" class="row g-3 align-items-center">
      <mat-form-field appearance="outline" class="col-md-3">
        <mat-label>Site Visit Date</mat-label>
        <input matInput [matDatepicker]="picker" formControlName="date" name="followUpDate" required />
        <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
        <mat-error *ngIf="addSiteVisitForm.get('date')?.hasError('required')">
          Visit date is required
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="col-md-3">
        <mat-label>Time</mat-label>
        <input type="time" matInput formControlName="time" required />
        <mat-error *ngIf="addSiteVisitForm.get('time')?.hasError('required')">
          Time is required
        </mat-error>
      </mat-form-field>
      
      <mat-form-field appearance="outline" class="col-md-3">
        <mat-label>Reason</mat-label>
        <input matInput formControlName="reason" required />
        <mat-error *ngIf="addSiteVisitForm.get('reason')?.hasError('required')">
          Reason is required
        </mat-error>
      </mat-form-field>
      
      <mat-form-field appearance="outline" class="col-md-3">
        <mat-label>Revisit</mat-label>
        <mat-select formControlName="is_revisit" required>
          <mat-option value="Revisit">Revisit</mat-option>
          <mat-option value="No revisit">No revisit</mat-option>
        </mat-select>
        <mat-error *ngIf="addSiteVisitForm.get('is_revisit')?.hasError('required')">
          Revisit selection is required
        </mat-error>
      </mat-form-field>
      
      <mat-form-field appearance="outline" class="col-md-6">
        <mat-label>Remark</mat-label>
        <textarea matInput formControlName="remark" rows="2"></textarea>
      </mat-form-field>

      <mat-dialog-actions align="end" class="col-md-12">
        <button mat-raised-button color="primary" type="submit" [disabled]="addSiteVisitForm.invalid">
          Save
        </button>
      </mat-dialog-actions>
    </form>
  </div>
</mat-dialog-content>
