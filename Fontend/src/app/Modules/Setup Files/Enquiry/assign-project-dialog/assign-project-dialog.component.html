<h2 mat-dialog-title>{{ data.title }}
    <button mat-icon-button mat-dialog-close style="position: absolute; top: 10px; right: 12px;">
        <mat-icon>close</mat-icon>
    </button>
</h2>
<mat-dialog-content class="mat-typography">


    <form [formGroup]="leadAssignForm" class="row g-3 align-items-center">
        <div class="row">

            <div class="col-md-12">
                <app-autocomplete-reusable-component [options]="projectsList" formControlName="project_id"
                    displayKey="property_name" idKey="project_id" placeholder="Select Project">
                </app-autocomplete-reusable-component>
            </div>
            
        </div>


    </form>

</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-raised-button color="primary"  (click)="onSubmit()" type="submit">
        Submit
    </button> </mat-dialog-actions>
