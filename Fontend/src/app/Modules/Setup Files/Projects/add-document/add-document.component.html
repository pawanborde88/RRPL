<h2 mat-dialog-title>{{ data.title }} 
  <button mat-icon-button mat-dialog-close style="position: absolute; top: 10px; right: 12px;">
    <mat-icon>close</mat-icon>
</button>
</h2>
<mat-dialog-content class="mat-typography">
  <form [formGroup]="addDocumentForm" class="row g-3 align-items-center mt-1" (ngSubmit)="onSubmit()">

    <!-- Name Input Field -->
    <mat-form-field appearance="outline" class="col-md-6">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" type="text" required />
    </mat-form-field>


    <mat-form-field appearance="outline" class="col-md-6">
      <mat-label>Active Status</mat-label>
      <mat-select formControlName="active_status_id">
        <mat-option [value]="1">Active</mat-option>
        <mat-option [value]="0">Inactive</mat-option>
      </mat-select>
    </mat-form-field>
    <!-- File Upload Field (Outside mat-form-field) -->
    <div class="col-12">
      <label class="form-label">Select a Document</label>
      <div class="d-flex align-items-center">
        <input id="fileInput" type="file" class="d-none" (change)="onFileSelected($event)" accept=".pdf,.doc,.docx"
          #fileInput />
        <button mat-raised-button color="primary" type="button" (click)="fileInput.click()">
          <mat-icon>attach_file</mat-icon> Upload File
        </button>
        <span *ngIf="selectedFileName" class="ms-2 text-success">{{ selectedFileName }}</span>
      </div>
    </div>

    <!-- Action Buttons -->
    <mat-dialog-actions align="end" class="col-12">
      <button mat-raised-button color="primary" type="submit">
        Save
      </button>

    </mat-dialog-actions>

  </form>
</mat-dialog-content>
