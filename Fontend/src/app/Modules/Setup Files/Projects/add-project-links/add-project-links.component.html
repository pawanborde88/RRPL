<h2 mat-dialog-title>{{ data.title }} 
        <button mat-icon-button mat-dialog-close style="position: absolute; top: 10px; right: 12px;">
        <mat-icon>close</mat-icon>
    </button>
</h2>
<mat-dialog-content class="mat-typography">
    <form [formGroup]="addProjectLinkForm" class="row mt-1" (ngSubmit)="onSubmit()">
        <mat-form-field  appearance="outline"  class="col-md-12">
            <mat-label>Display Name</mat-label>
            <input matInput formControlName="display_name" type="text" placeholder="Enter Display name" />
        </mat-form-field>

        <mat-form-field  appearance="outline" class="col-md-12">
            <mat-label>Project Link</mat-label>
            <input matInput formControlName="project_link" type="url" placeholder="Enter project link" />
    
        </mat-form-field>

        <mat-dialog-actions align="end" class="col-12">
            <button mat-raised-button color="primary" type="submit" class="btn btn-primary"
               >
                Save
            </button>
        </mat-dialog-actions>
    </form>
</mat-dialog-content>
