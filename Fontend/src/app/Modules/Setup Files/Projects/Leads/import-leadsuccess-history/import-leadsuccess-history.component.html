<h2 mat-dialog-title>Import Results</h2>
<mat-dialog-content>
    <div >
    
        <app-reusable-custom-table [loading]="loading" [dataSource]="dataSource" [displayedColumns]="displayedColumns"
            [showFooter]="true" >
        </app-reusable-custom-table>
    </div>

</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-button mat-dialog-close>Close</button>
</mat-dialog-actions>
