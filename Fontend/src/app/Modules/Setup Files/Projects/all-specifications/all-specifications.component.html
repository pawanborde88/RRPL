<div class="w-full space-y-4">
    <!-- Header Section -->
    <div class="flex items-center justify-between">
        <button mat-raised-button color="primary"
            class="!h-9 !px-4 !rounded-xl !text-sm !font-bold shadow-sm hover:shadow-md transition-all"
            (click)="openSpecificationDialog('add')">
            <mat-icon class="!w-5 !h-5 mr-1">add_circle</mat-icon>
            Add Specification
        </button>
    </div>

    <!-- Specifications Grid -->
    <ng-container *ngIf="allProjectSpecifiationList.length > 0; else noSpecificationsTemplate">
        <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 xl:grid-cols-8 gap-3">
            <div *ngFor="let specification of allProjectSpecifiationList"
                class="group relative bg-white rounded-xl border border-gray-100 shadow-sm hover:shadow-md hover:border-amber-200 transition-all duration-300 overflow-hidden flex flex-col items-center p-3 text-center cursor-pointer"
                (click)="openSpecificationDialog('edit', specification)">

                <!-- Icon/Image Container -->
                <div class="relative w-14 h-14 mb-2 group-hover:scale-110 transition-transform duration-300">
                    <div
                        class="absolute inset-0 bg-amber-50 rounded-full scale-110 opacity-0 group-hover:opacity-100 transition-opacity">
                    </div>
                    <img (click)="$event.stopPropagation(); previewImages(specification)"
                        class="relative z-10 w-full h-full object-cover rounded-full border border-gray-100 shadow-sm"
                        [src]="specification.specification_icon ? (storageUrl + '/' + specification.specification_icon) : 'assets/Images/dummy.png'"
                        alt="Specification Icon" />
                </div>

                <!-- Content -->
                <div class="w-full">
                    <h4 class="text-[5px] font-bold text-gray-800 leading-tight truncate" [title]="specification.title">
                        {{ specification.title }}
                    </h4>
                    <p class="text-[10px] text-gray-500 leading-tight line-clamp-2 px-1">
                        {{ specification.description }}
                    </p>
                </div>

                <!-- Hover Overlay for Edit -->
                <div class="absolute top-1 right-1 opacity-0 group-hover:opacity-100 transition-opacity">
                    <div class="p-1 bg-amber-100 rounded-lg text-amber-600">
                        <mat-icon class="!w-3 !h-3 !text-[12px] flex items-center justify-center">edit</mat-icon>
                    </div>
                </div>
            </div>
        </div>
    </ng-container>

    <!-- Empty State -->
    <ng-template #noSpecificationsTemplate>
        <div
            class="flex flex-col items-center justify-center py-12 px-4 bg-gray-50 rounded-2xl border-2 border-dashed border-gray-200">
            <div class="w-12 h-12 bg-gray-100 rounded-full flex items-center justify-center mb-3">
                <mat-icon class="text-gray-400 !w-6 !h-6 !text-[24px]">assignment_late</mat-icon>
            </div>
            <h5 class="text-sm font-bold text-gray-700 mb-1">No Specifications Found</h5>
            <p class="text-xs text-gray-500 text-center max-w-[200px]">Define the core specifications for this project
                to help buyers understand the quality.</p>
        </div>
    </ng-template>
</div>
