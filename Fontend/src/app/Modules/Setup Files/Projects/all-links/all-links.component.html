<div class="row d-flex justify-content-between align-items-center">
  <div class="col-auto">
    <h4>Project Links</h4>
  </div>
 
</div>

<mat-card class="p-3 shadow-sm" *ngIf="allProjectLinks && allProjectLinks.length > 0; else noLinks">
  <mat-list class="mt-2">
    <mat-list-item *ngFor="let link of allProjectLinks" class="d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center">
        <mat-icon class="text-primary me-2">link</mat-icon>
        <a [href]="link.project_link" target="_blank" class="text-decoration-none">
          {{ link.display_name }}
        </a>
      </div>
      <button mat-icon-button color="warn" (click)="$event.stopPropagation(); deletelink(link.project_link_id)">
        <mat-icon>delete</mat-icon>
      </button>
    </mat-list-item>
  </mat-list>
  <div class="text-end mt-3">
    <button mat-button color="primary" (click)="addProjectLink('add')">
      <mat-icon class="me-1">add_link</mat-icon> Add more...
    </button>
  </div>
</mat-card>

<ng-template #noLinks>
  <mat-card class="p-4 text-center shadow-sm bg-light mt-3">
    <mat-card-content class="d-flex flex-column align-items-center">
      <mat-icon>error</mat-icon>
      <h5 class="mt-3 fw-bold text-muted">No Links Available</h5>
      <button mat-raised-button color="primary" (click)="addProjectLink('add')" class="mt-2">
        <mat-icon class="me-1">add_link</mat-icon> Add Link
      </button>
    </mat-card-content>
  </mat-card>
</ng-template>
