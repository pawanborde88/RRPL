<div class="otp-dialog-container p-5 sm:p-8">
    <!-- Top Pattern/Accent -->

    <div>
        <!-- Close Button -->
        <button (click)="close()"
            class="absolute top-6 right-6 p-2 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-full transition-all duration-200">
            <mat-icon>close</mat-icon>
        </button>

        <!-- Header -->
        <div class="text-center mb-10">
            <div
                class="inline-flex items-center justify-center w-16 h-16 bg-sky-900 rounded-2xl text-white mb-6 shadow-sm border border-sky-900">
                <mat-icon class="scale-[1.6]">mail_lock</mat-icon>
            </div>
            <h4 class="text-2xl font-black text-slate-900 tracking-tight mb-3">Verification Required</h4>
            <p class="text-sm text-slate-500 leading-relaxed">
                We've sent a 6-digit secure code to your email
                <span class="block mt-1 font-bold  truncate">{{ data.email_id }}</span>
            </p>
        </div>

        <!-- Input Area -->
        <div class="space-y-8">
            <div class="flex justify-between items-center gap-3" (paste)="onPaste($event)">
                <div *ngFor="let ctrl of otpFields; let i = index" class="relative group flex-1">
                    <input matInput [formControl]="ctrl" maxlength="1" type="tel" (input)="onInput($event, i)"
                        (keydown)="onKeyDown($event, i)"
                        class="otp-input w-full h-14 sm:h-16 text-center text-2xl font-black rounded-xl border-2 transition-all duration-200 outline-none
                        bg-slate-50 text-slate-900 border-slate-200 group-hover:border-slate-300 focus:border-sky-300 focus:bg-white focus:ring-4 focus:ring-sky-300/10 placeholder:text-slate-300"
                        placeholder="•">
                    <!-- Subtle indicator under active input could be added here if needed -->
                </div>
            </div>

            <!-- Error Display -->
            <div *ngIf="errorMessage()"
                class="text-center text-sm font-bold text-red-600 bg-red-50 py-2.5 px-3 rounded-lg border border-red-100 flex items-center justify-center gap-2">
                <mat-icon class="scale-90 text-red-500">error_outline</mat-icon>
                Oops! That OTP is incorrect. Please try again.
            </div>

            <!-- Action Buttons -->
            <div class="space-y-4 pt-2">
                <button mat-flat-button color="primary"
                    class="!w-full !h-14 !text-base !font-bold !rounded-2xl bg-sky-900"
                    [disabled]="isOtpLoading() || !otpFields[5].value" (click)="verifyOtp()">
                    <div class="flex items-center justify-center gap-2">
                        <mat-icon *ngIf="!isOtpLoading()" class="scale-110">verified</mat-icon>
                        <mat-spinner *ngIf="isOtpLoading()" diameter="24" class="!text-white"></mat-spinner>
                        <span>{{ isOtpLoading() ? 'Verifying Code...' : 'Verify & Continue' }}</span>
                    </div>
                </button>
            </div>

            <!-- Footer / Resend -->
            <div class="text-center space-y-4">
                <div class="flex items-center justify-center gap-2 text-sm">
                    <span class="text-slate-400">Didn't get the email?</span>
                    <button (click)="resendOtp()" [disabled]="isOtpLoading() || !canResendOtp()"
                        class="font-bold  hover:text-sky-900 disabled:text-slate-300 disabled:cursor-not-allowed transition-colors">
                        {{ canResendOtp() ? 'Resend now' : 'Wait ' + otpTimer() + 's' }}
                    </button>
                </div>

            </div>
        </div>
    </div>
</div>
