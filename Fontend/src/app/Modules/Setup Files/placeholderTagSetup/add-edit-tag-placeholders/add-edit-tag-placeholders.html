<h4 mat-dialog-title>{{ isEditMode() ? 'Edit' : 'Add' }} Tag Placeholder
    <button mat-icon-button mat-dialog-close style="position: absolute; top: 10px; right: 12px;">
        <mat-icon>close</mat-icon>
    </button>
</h4>
<mat-dialog-content>
    <form [formGroup]="tagForm">
        <div class="row">

            <!-- Module -->
            <div class="col-12 col-md-6 ">
                <app-autocomplete-reusable-component class="w-50" formControlName="module_id" [options]="allModules()"
                    idKey="module_id" displayKey="module_name" placeholder="Select Module">
                </app-autocomplete-reusable-component>
            </div>

            <!-- Tag Name -->
            <div class="col-12 col-md-6 ">
                <mat-form-field appearance="outline" class="w-100">
                    <mat-label>Tag Name</mat-label>
                    <input matInput formControlName="tag_name" placeholder="e.g. #tag_name#" required>
                    <mat-error *ngIf="tagForm.get('tag_name')?.hasError('required')">
                        Tag Name is required
                    </mat-error>
                </mat-form-field>
            </div>

            <div class="col-md-12">
                <app-autocomplete-reusable-component class="w-50" formControlName="colum_name"
                    [options]="columnOptions()" idKey="colum_name" displayKey="colum_name"
                    placeholder="Select Column Name">
                </app-autocomplete-reusable-component>
            </div>



            <!-- Description -->
            <div class="col-12 ">
                <mat-form-field appearance="outline" class="w-100">
                    <mat-label>Description</mat-label>
                    <input matInput formControlName="description" placeholder="Tag Description...">
                </mat-form-field>
            </div>

        </div>
    </form>
</mat-dialog-content>
<mat-dialog-actions align="end" class="dialog-actions p-3">
    <button mat-raised-button (click)="onSubmit()" color="primary" type="submit"
        [disabled]="tagForm.invalid || loading()">
        {{ isEditMode() ? 'Update Hash Tag' : 'Save Hash Tag' }}
    </button>
</mat-dialog-actions>
