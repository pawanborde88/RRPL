<app-template>
  <app-breadcrumb>
    <li class="breadcrumb-item"><a routerLink="/setup/courses">All Courses</a></li>
    <li class="breadcrumb-item active">{{ quizTitle }}</li>
  </app-breadcrumb>

  <!-- Loading Indicator -->
  <mat-progress-bar *ngIf="loading" mode="query"></mat-progress-bar>

  <div *ngFor="let q of questions; let i = index">
    <mat-card class="mb-3 mt-4">
      <!-- Header -->
      <div class="d-flex justify-content-between align-items-center p-3 border-bottom">
        <div class="fw-bold fs-5">
          Q{{ i + 1 }}. {{ q.question }}
        </div>
        <div class="d-flex align-items-center gap-1">
          <span class="badge bg-warning rounded-pill fs-6">{{ q.points }}</span>
        </div>
      </div>

      <!-- Options -->
      <mat-card-content class="pt-2">
        <mat-radio-group [(ngModel)]="selectedAnswers[q.id]" [disabled]="isQuestionLocked(q.id)">
          <div *ngFor="let opt of q.options">
            <mat-radio-button class="d-block" [value]="opt.id" (change)="onOptionSelected(q, opt.id)">
              {{ opt.text }}
            </mat-radio-button>
          </div>
        </mat-radio-group>

      </mat-card-content>
    </mat-card>
  </div>

  <!-- Submit Button -->
  <div class="text-center mt-4 mb-5">
    <button mat-raised-button color="primary" (click)="submitAnswers()">Submit Quiz</button>
  </div>

</app-template>
