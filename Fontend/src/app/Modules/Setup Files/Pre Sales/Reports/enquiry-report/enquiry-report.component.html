<app-template>
    <app-breadcrumb>
        <li class="breadcrumb-item ">Sales Management</li>
        <li class="breadcrumb-item ">Reports</li>

        <li class="breadcrumb-item active"> Enquiry Tracking Report</li>
    </app-breadcrumb>

    <mat-accordion>
        <mat-expansion-panel hideToggle [expanded]="true">
            <mat-expansion-panel-header>
                <mat-panel-title> Advanced Filters </mat-panel-title>

            </mat-expansion-panel-header>
            <form [formGroup]="leadForm" class="w-100 g-3">
                <div class="row">
                    <!-- Project Dropdown -->
                    <div class="col-md-2">
                        <app-autocomplete-reusable-component [options]="projectsList()" formControlName="project_id"
                            displayKey="property_name" idKey="project_id" [isMultiSelect]="true"
                            placeholder="Select Project">
                        </app-autocomplete-reusable-component>
                    </div>
                    <app-autocomplete-reusable-component *ngIf="roleId() !== 7" class="col-md-2"
                        [options]="allSalesExecutive()" formControlName="sales_executive_id" displayKey="user_name"
                        idKey="user_id" [isMultiSelect]="true" placeholder="Select Sales Executive">
                    </app-autocomplete-reusable-component>

                    <!-- Lead Level Dropdown with Async Pipe (like comment-log component) -->
                    <mat-form-field appearance="outline" class="col-md-2">
                        <mat-label>Lead Level</mat-label>
                        <mat-select formControlName="lead_level_id">
                            <mat-option value="0" disabled>Select Lead Level</mat-option>
                            <mat-option *ngFor="let level of leadLevels$ | async; trackBy: trackByLeadLevelId"
                                [value]="level.lead_level_id">
                                {{ level.lead_level }}
                            </mat-option>
                        </mat-select>
                    </mat-form-field>

                    <!-- Call Status Dropdown with Async Pipe (like comment-log component) -->
                    <mat-form-field appearance="outline" class="col-md-2">
                        <mat-label>Call Status</mat-label>
                        <mat-select formControlName="call_status_id">
                            <mat-option *ngFor="let callStatus of callStatus$ | async; trackBy: trackByCallStatusId"
                                [value]="callStatus.call_status_id">
                                {{ callStatus.call_status }}
                            </mat-option>
                        </mat-select>
                    </mat-form-field>



                    <!-- Follow-up Date Range -->
                    <div class="col-md-2">
                        <mat-form-field appearance="outline" class="w-100">
                            <mat-label> Date</mat-label>
                            <mat-date-range-input [rangePicker]="followUpDatePicker"
                                [disabled]="leadForm.get('ignore_date_filters')?.value">
                                <input matStartDate formControlName="from_date" placeholder="Start date">
                                <input matEndDate formControlName="to_date" placeholder="End date">
                            </mat-date-range-input>
                            <mat-datepicker-toggle matIconSuffix [for]="followUpDatePicker"></mat-datepicker-toggle>
                            <mat-date-range-picker #followUpDatePicker></mat-date-range-picker>
                        </mat-form-field>
                    </div>
                    <!-- <div class="col-md-2 d-flex align-items-center">
                            <mat-checkbox formControlName="ignore_date_filters">Ignore Date Filters</mat-checkbox>
                        </div> -->

                    <!-- Apply Filter Button -->
                    <div class="col-md-auto">
                        <button mat-raised-button color="primary" class="d-flex align-items-center w-100"
                            [disabled]="!leadForm.get('project_id')?.value?.length" (click)="fetchAllProjectLeads()">
                            Apply Filter
                        </button>
                    </div>
                </div>
            </form>

        </mat-expansion-panel>

    </mat-accordion>



    <app-configurable-ag-grid-data [columns]="columnDefinitions" [apiEndpoint]="'comment_all_follow_report'"
        [apiMethod]="'POST'" [apiPayload]="agGridPayload()" [actions]="bookingActions" [idProperty]="'enquiry_id'"
        (actionClick)="onBookingAction($event.action, $event.row)">
    </app-configurable-ag-grid-data>

</app-template>
