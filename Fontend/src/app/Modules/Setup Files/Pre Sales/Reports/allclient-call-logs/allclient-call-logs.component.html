<app-template>
    <app-breadcrumb>
        <li class="breadcrumb-item ">Lead Management</li>

        <li class="breadcrumb-item ">Reports</li>
        <li class="breadcrumb-item active">All Leads Call Logs</li>
    </app-breadcrumb>



    <mat-accordion>
        <mat-expansion-panel hideToggle [expanded]="true">
            <mat-expansion-panel-header>
                <mat-panel-title> Advanced Filters </mat-panel-title>

            </mat-expansion-panel-header>
            <form [formGroup]="leadForm" class="w-100 g-3">
                <div class="row">
                    <!-- Project Dropdown -->
                    <div class="col-md-2">
                        <app-autocomplete-reusable-component [options]="projectsList()" formControlName="project_id"
                            displayKey="property_name" idKey="project_id" [isMultiSelect]="true"
                            placeholder="Select Project">
                        </app-autocomplete-reusable-component>
                    </div>

                    <!-- Status -->
                    <div class="col-md-2">
                        <app-autocomplete-reusable-component [options]="statusDropdown()" formControlName="status_id"
                            displayKey="enquiry_status" idKey="enquiry_status_id" [isMultiSelect]="true"
                            placeholder="Select Status">
                        </app-autocomplete-reusable-component>
                    </div>

                    <!-- Telecaller -->
                    <div class="col-md-2">
                        <app-autocomplete-reusable-component [options]="allTelecallerlist()"
                            formControlName="telecaller_id" displayKey="full_name" idKey="user_id"
                            [isMultiSelect]="true" placeholder="Select Telecaller">
                        </app-autocomplete-reusable-component>
                    </div>

                    <!-- Lead Date Range -->
                    <div class="col-md-2">
                        <mat-form-field appearance="outline" class="w-100">
                            <mat-label>Lead Date</mat-label>
                            <mat-date-range-input [rangePicker]="leadDatePicker">
                                <input matStartDate formControlName="start_date" placeholder="Start date">
                                <input matEndDate formControlName="end_date" placeholder="End date">
                            </mat-date-range-input>
                            <mat-datepicker-toggle matIconSuffix [for]="leadDatePicker"></mat-datepicker-toggle>
                            <mat-date-range-picker #leadDatePicker></mat-date-range-picker>
                        </mat-form-field>
                    </div>

                    <!-- Follow-up Date Range -->
                    <div class="col-md-2">
                        <mat-form-field appearance="outline" class="w-100">
                            <mat-label>Follow-up Date</mat-label>
                            <mat-date-range-input [rangePicker]="followUpDatePicker">
                                <input matStartDate formControlName="start_followup_date" placeholder="Start date">
                                <input matEndDate formControlName="end_followup_date" placeholder="End date">
                            </mat-date-range-input>
                            <mat-datepicker-toggle matIconSuffix [for]="followUpDatePicker"></mat-datepicker-toggle>
                            <mat-date-range-picker #followUpDatePicker></mat-date-range-picker>
                        </mat-form-field>
                    </div>

                    <!-- Apply Filter Button -->
                    <div class="col-md-2">
                        <button mat-raised-button color="primary" class="d-flex align-items-center w-100"
                            [disabled]="!leadForm.get('project_id')?.value?.length" (click)="applyFilters()">
                            <mat-icon class="me-1">filter_list</mat-icon> Apply Filter
                        </button>
                    </div>
                </div>
            </form>

        </mat-expansion-panel>

    </mat-accordion>



    <app-configurable-ag-grid-data [columns]="columnDefinitions" [apiEndpoint]="'fetch_call_logs'" [apiMethod]="'POST'"
        [apiPayload]="agGridPayload()" [actions]="bookingActions" [idProperty]="'project_lead_id'" [cacheBlockSize]="30"
        (actionClick)="onBookingAction($event.action, $event.row)">
    </app-configurable-ag-grid-data>



</app-template>
