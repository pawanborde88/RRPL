<app-template>
    <app-breadcrumb>
        <li class="breadcrumb-item"><a routerLink="/">Pre Sales</a></li>
        <li class="breadcrumb-item"><a routerLink="/">Report</a></li>
        <li class="breadcrumb-item active">Whatsapp Message Logs</li>
      </app-breadcrumb>
      
      <mat-card>
        <mat-card-header class="d-flex align-items-center">
          <h2>Whatsapp Message Logs</h2>
        </mat-card-header>
      
        <mat-card-content>
          <mat-progress-bar *ngIf="loading" mode="query"></mat-progress-bar>
      
          <div class="table-responsive example-container mat-elevation-z8 rounded">
            <table mat-table [dataSource]="dataSource" class="mat-elevation-z8" matSort>
      
              <!-- Dynamic Columns -->
              <ng-container *ngFor="let column of displayedColumns" [matColumnDef]="column.key">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> {{ column.label }} </th>
                <td mat-cell *matCellDef="let element"> {{ element[column.key] || '-' }} </td>
              </ng-container>
      
              <!-- Table Header and Row -->
              <tr mat-header-row *matHeaderRowDef="columnKeys"></tr>
              <tr mat-row *matRowDef="let row; columns: columnKeys;"></tr>
            </table>
      
            <!-- Paginator -->
            <mat-paginator [pageSizeOptions]="[10, 15, 20]" showFirstLastButtons aria-label="Select page of Enquiries">
            </mat-paginator>
          </div>
        </mat-card-content>
      </mat-card>
      
</app-template>
