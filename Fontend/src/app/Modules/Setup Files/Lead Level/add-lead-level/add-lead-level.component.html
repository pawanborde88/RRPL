<h2 mat-dialog-title>{{ data.title }} 
  <button mat-icon-button mat-dialog-close style="position: absolute; top: 10px; right: 10px;">
    <mat-icon>close</mat-icon>
</button>
</h2>
<mat-dialog-content class="mat-typography">
  <form [formGroup]="addLeadLevelForm" (ngSubmit)="onSubmit()">
    <div class="row">
      <mat-form-field appearance="outline" class="col-md-12" *ngIf="!data.leadLevelID">
        <mat-label>Lead Level</mat-label>
        <input formControlName="lead_level" matInput placeholder="Enter lead level" />
        <mat-error *ngIf="addLeadLevelForm.get('lead_level')?.invalid && addLeadLevelForm.get('lead_level')?.touched">
          Lead level is required
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="col-md-12" *ngIf="data.leadLevelID">
        <mat-label>Call Status</mat-label>
        <input formControlName="call_status" matInput placeholder="Enter Call Status" />
        <mat-error *ngIf="addLeadLevelForm.get('call_status')?.invalid && addLeadLevelForm.get('call_status')?.touched">
          Call status is required
        </mat-error>
      </mat-form-field>
      <mat-form-field appearance="outline" class="col-md-12">
        <mat-label>Active Status</mat-label>
        <mat-select formControlName="active_status_id">
          <mat-option [value]="1">Active</mat-option>
          <mat-option [value]="0">Inactive</mat-option>
        </mat-select>
      </mat-form-field>
    </div>
    
    <mat-dialog-actions align="end">
      <button mat-raised-button color="primary" type="submit">
        Save
      </button>
    </mat-dialog-actions>
  </form>
</mat-dialog-content>
