<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content class="mat-typography">

    <form [formGroup]="addEvents" class="row">

        <div class="col-md-3">
            <app-autocomplete-reusable-component [options]="projectsList()" formControlName="project_id"
                displayKey="property_name" idKey="project_id" placeholder="Select Project" class="w-100">
            </app-autocomplete-reusable-component>
        </div>

        <div class="col-md-3">
            <app-autocomplete-reusable-component [options]="eventTypeList()" formControlName="event_type_id"
                displayKey="event_type" idKey="event_type_id" placeholder="Select Event Type" class="w-100">
            </app-autocomplete-reusable-component>
        </div>


        <mat-form-field appearance="outline" class="col-md-6">
            <mat-label>Event Title</mat-label>
            <input matInput formControlName="event_title" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="col-md-6">
            <mat-label> Event Description</mat-label>
            <input matInput formControlName="event_description" class="custom-textarea">
        </mat-form-field>

        <mat-form-field appearance="outline" class="col-md-6">
            <mat-label>Event Date</mat-label>
            <input matInput [matDatepicker]="eventDate" formControlName="event_date" />
            <mat-datepicker-toggle matSuffix [for]="eventDate"></mat-datepicker-toggle>
            <mat-datepicker #eventDate></mat-datepicker>
        </mat-form-field>

        <mat-form-field appearance="outline" class="col-md-6">
            <mat-label>Event Venue</mat-label>
            <input matInput formControlName="event_venue" />
        </mat-form-field>

        <div class="col-md-3">
            <mat-label>Event Start Time</mat-label>

            <input class="mx-1 time-input form-control" type="time" placeholder="End Time"
                formControlName="event_start_time">          
        </div>
        <div class="col-md-3">
            <mat-label>Event End Time</mat-label>

            <input class="mx-1 time-input form-control" type="time" placeholder="End Time"
                formControlName="event_end_time">
                      
        </div>

        <div class="col-md-6 mb-2 flex items-center pt-4">
            <mat-checkbox formControlName="is_highlight">
                Highlight this event
            </mat-checkbox>
        </div>
        <div class="col-md-6">
            <label class="block text-sm font-medium text-gray-700 mb-1">Upload Event Image</label>

            <input #fileInput type="file" (change)="onChangeFile($event)" formControlName="event_image" class="hidden"
                accept="image/*" />

            <!-- Upload Area (Visible when no image preview) -->
            <div *ngIf="!imagePreview" (click)="fileInput.click()"
                class="relative border-2 border-dashed border-gray-300 rounded-xl p-4 transition-all duration-300 hover:border-blue-500 hover:bg-blue-50/50 group cursor-pointer flex flex-col items-center justify-center min-h-[140px] bg-gray-50/30">

                <div
                    class="w-12 h-12 rounded-full bg-white shadow-sm flex items-center justify-center group-hover:scale-110 transition-transform duration-300 mb-3 border border-gray-100">
                    <mat-icon class="!text-2xl text-gray-400 group-hover:text-blue-500">add_photo_alternate</mat-icon>
                </div>

                <div class="text-center">
                    <p class="text-sm text-gray-700 font-semibold group-hover:text-blue-700">Click to upload event
                        banner</p>
                    <p class="text-[11px] text-gray-400 mt-0.5 uppercase tracking-wider">Supports JPEG, PNG, GIF</p>
                </div>
            </div>

            <!-- Image Preview Area (Visible when image exists) -->
            <div *ngIf="imagePreview" class="relative group w-full max-w-[240px] mt-1 pr-2">
                <div
                    class="relative overflow-hidden rounded-xl shadow-md border-2 border-white aspect-video bg-gray-100 ring-1 ring-gray-200">
                    <img [src]="imagePreview" alt="Event Image" class="w-full h-full object-cover">

                    <!-- Sleek Overlay with Controls (Always visible when image exists) -->
                    <div
                        class="absolute inset-0 bg-gradient-to-t from-black/50 via-transparent to-transparent flex items-end justify-center p-3 transition-all duration-300">
                        <div class="flex gap-4">
                            <button type="button" mat-mini-fab color="primary"
                                class="!w-8 !h-8 !bg-white/95 !text-blue-600 shadow-md hover:scale-110 active:scale-95 transition-all duration-200 flex items-center justify-center"
                                (click)="fileInput.click()" matTooltip="Change Image">
                                <mat-icon class="!text-lg !leading-none !h-fit !w-fit">edit</mat-icon>
                            </button>
                            <button type="button" mat-mini-fab color="warn"
                                class="!w-8 !h-8 shadow-md hover:scale-110 active:scale-95 transition-all duration-200 flex items-center justify-center"
                                (click)="onDeleteImage()" matTooltip="Remove Image">
                                <mat-icon class="!text-lg !leading-none !h-fit !w-fit">delete</mat-icon>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>


    </form>

</mat-dialog-content>

<mat-dialog-actions align="end" class="col-12 mt-3">

    <button mat-raised-button [disabled]=" addEvents.invalid" color="primary" (click)="onSubmit()">Submit</button>
    <button mat-raised-button color="warn" mat-dialog-close>Cancel</button>
</mat-dialog-actions>
