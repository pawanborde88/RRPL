<div class="min-h-screen bg-slate-100 py-6 px-4 sm:py-12 sm:px-6 lg:px-8">
  <div class="max-w-xl mx-auto">
    <!-- Header Section -->
    <div class="text-center mb-10">
      <div
        class="inline-flex items-center justify-center p-4 bg-indigo-600 rounded-3xl shadow-2xl mb-6 ring-4 ring-indigo-50">
        <mat-icon class="text-white scale-150">qr_code_scanner</mat-icon>
      </div>
      <h1 class="text-4xl font-black text-slate-900 tracking-tight sm:text-5xl">Scan & Attend</h1>
      <p class="mt-4 text-slate-500 font-medium text-lg">Mark attendance instantly with our rapid QR scanner</p>
    </div>

    <!-- Scanner Main Card -->
    <div class="bg-white rounded-[2.5rem] shadow-2xl overflow-hidden border border-slate-200/60">
      <div class="relative scanner-box bg-slate-950 aspect-square sm:aspect-video" [class.is-scanning]="isScanning">
        <!-- Video Preview -->
        <video #videoElement class="w-full h-full object-cover" autoplay muted playsinline></video>

        <!-- Scanner Overlay -->
        <div class="absolute inset-0 z-10 pointer-events-none">
          <div class="scan-laser" *ngIf="isScanning && !isMarkingAttendance"></div>
          <div class="scan-guide" *ngIf="isScanning">
            <span></span>
          </div>
        </div>

        <!-- Scanning Controls Overlay (Glassmorphism) -->
        <div class="absolute bottom-6 left-1/2 -translate-x-1/2 z-20 flex gap-4 p-2 glass-morphism rounded-2xl"
          *ngIf="isScanning && !isMarkingAttendance">
          <button mat-icon-button (click)="toggleCamera()" *ngIf="availableDevices.length > 1"
            class="text-white hover:bg-white/20" matTooltip="Switch Camera">
            <mat-icon>flip_camera_ios</mat-icon>
          </button>
          <button mat-icon-button (click)="stopScanner()" class="text-rose-400 hover:bg-rose-500/20"
            matTooltip="Stop Scanner">
            <mat-icon>stop_circle</mat-icon>
          </button>
        </div>

        <!-- Empty State / Start Button -->
        <div *ngIf="!isScanning && !isMarkingAttendance"
          class="absolute inset-0 z-20 flex flex-col items-center justify-center bg-slate-900/40 backdrop-blur-md">
          <button (click)="startScanner()"
            class="group relative flex items-center gap-3 bg-indigo-600 hover:bg-indigo-700 text-white px-8 py-4 rounded-2xl font-bold text-lg shadow-2xl transition-all hover:scale-105 active:scale-95">
            <mat-icon class="group-hover:rotate-12 transition-transform">videocam</mat-icon>
            Start Scanner
          </button>
          <p class="mt-6 text-white/90 text-sm font-semibold tracking-wider uppercase">Camera ready for scanning</p>
        </div>

        <!-- Marking Attendance Loader -->
        <div *ngIf="isMarkingAttendance"
          class="absolute inset-0 z-30 flex flex-col items-center justify-center bg-indigo-950/80 backdrop-blur-xl transition-all">
          <mat-spinner diameter="60" strokeWidth="6" class="custom-spinner"></mat-spinner>
          <p class="mt-8 text-white font-black text-xl animate-pulse tracking-widest uppercase">Validating QR...</p>
        </div>
      </div>

      <!-- Quick Info / Status Area -->
      <div class="p-6 bg-white border-t border-slate-100">
        <div *ngIf="!statusMessage && !isMarkingAttendance" class="flex items-center gap-4 text-slate-400">
          <mat-icon class="opacity-50">info</mat-icon>
          <p class="text-sm font-medium">Position the QR code within the frame for instant detection.</p>
        </div>


      </div>
    </div>


  </div>
</div>
