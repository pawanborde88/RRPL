<app-template>
  <app-breadcrumb>
    <li class="breadcrumb-item active">{{ viewMode() === 'leadLevel' ? 'All Lead Level' : 'All City Subregion' }}</li>
  </app-breadcrumb>

  <mat-card>
    <mat-card-header class="flex items-center justify-between">

      <button mat-raised-button color="primary" class="flex items-center gap-2"
        (click)="viewMode() === 'leadLevel' ? openLeadLevelDialog('add') : openAddcitySubregionDialog('add', 'city')">
        <mat-icon class="!text-lg">add_circle</mat-icon>
        {{ viewMode() === 'leadLevel' ? 'Add Lead Level' : 'Add City' }}
      </button>
    </mat-card-header>

    <mat-card-content>
      <mat-progress-bar *ngIf="loading()" mode="query"></mat-progress-bar>

      <div class="overflow-x-auto rounded-lg shadow-md" style="height: 600px;">
        <ag-grid-angular style="width: 100%; height: 100%;" class="ag-theme-quartz" [columnDefs]="columnDefs()"
          [defaultColDef]="defaultColDef" [rowData]="displayRowData()" [pagination]="true" [getRowHeight]="getRowHeight"
          [fullWidthCellRenderer]="detailCellRenderer" [fullWidthCellRendererParams]="detailCellRendererParams()"
          [isFullWidthRow]="isFullWidthRow" [paginationPageSize]="10" [paginationPageSizeSelector]="[10, 15, 20]"
          [animateRows]="true" [enableCellTextSelection]="true" [suppressCellFocus]="true" [loading]="loading()"
          (gridReady)="onGridReady($event)" (rowClicked)="onRowClicked($event)">
        </ag-grid-angular>

      </div>
    </mat-card-content>
  </mat-card>
</app-template>
