<app-template>
    <table mat-table [dataSource]="tableData" class="mat-elevation-z8" multiTemplateDataRows>
      <!-- City Header -->
      <ng-container matColumnDef="city">
        <th mat-header-cell *matHeaderCellDef> City </th>
        <td mat-cell *matCellDef="let element" [attr.rowspan]="element.rowSpan || null">
          {{ element.city }}
        </td>
      </ng-container>
  
      <!-- Sub Region Header -->
      <ng-container matColumnDef="subRegion">
        <th mat-header-cell *matHeaderCellDef> Sub Region </th>
        <td mat-cell *matCellDef="let element">
          {{ element.subRegion }}
        </td>
      </ng-container>


      <ng-container matColumnDef="report">
        <th mat-header-cell *matHeaderCellDef> Report </th>
        <td mat-cell *matCellDef="let element">
          <div >
            <div>Budget:</div>
            <div>Expenses: </div>
            <div>Over/Under: </div>
          </div>
        </td>
      </ng-container>
  
      <!-- Dynamic Month Columns -->
      <ng-container *ngFor="let month of groupsColumns" [matColumnDef]="month">
        <th mat-header-cell *matHeaderCellDef> {{ month }} </th>
        <td mat-cell *matCellDef="let element">
          <div >
            <div> {{ element.months[month]?.budget || 'N/A' }}</div>
            <div> {{ element.months[month]?.expense|| 'N/A' }}</div>
            <div> {{ element.months[month]?.total || 'N/A' }}</div>
          </div>
        </td>
      </ng-container>
  
      <!-- Table Header and Rows -->
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </app-template>
