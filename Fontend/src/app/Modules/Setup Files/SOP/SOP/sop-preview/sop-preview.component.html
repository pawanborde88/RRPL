<h2 mat-dialog-title>{{ sopSteplist?.sop_detail ?.title }}</h2>

<mat-dialog-content class="mat-typography">
    <!-- Featured Image -->
    <div class="image-container" style="text-align: center; margin-bottom: 20px;">
        <img alt="SOP Featured Image" style="max-height: 300px; max-width: 100%; border-radius: 10px;"
            [src]="sopSteplist?.sop_detail?.featured_image ? (storageUrl + '/' + sopSteplist.sop_detail.featured_image) : 'assets/Images/avatar.png'" />
    </div>

    <!-- SOP Details -->
    <div class="sop-detail" [innerHTML]="sopSteplist?.sop_detail?.sop_detail"
        style="margin-bottom: 20px; font-size: 16px; line-height: 1.6;"></div>

    <!-- SOP Steps -->
    <ng-container *ngIf="sopSteplist?.sop_steps && sopSteplist.sop_steps.length > 0; else noSteps">
        <div class="steps-container">
            <div *ngFor="let step of sopSteplist.sop_steps" class="step-item">
                <mat-card class="step-card" style="margin-bottom: 20px; border-left: 4px solid #3f51b5;">
                    <mat-card-header>
                        <mat-card-title>
                            <span style="font-weight: bold; color: #3f51b5;">Step {{ step.sequence }}:</span>
                        </mat-card-title>
                    </mat-card-header>
                    <mat-card-content>
                        <div [innerHTML]="step.sop_step" style="font-size: 14px; line-height: 1.6;"></div>
                    </mat-card-content>
                </mat-card>
            </div>
        </div>
     
    </ng-container>
   
    <!-- No Steps Available -->
    <ng-template #noSteps>
        <div class="alert alert-info text-center mt-3">
            No SOP steps available. Please add a step to get started.
        </div>
    </ng-template>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <mat-form-field class="w-75">
        <mat-label>Purpose</mat-label>
        <input matInput placeholder="Purpose" [(ngModel)]="purpose" [required]="true" >
    
        <!-- <mat-error *ngIf=".invalid && .touched">Purpose is required</mat-error> -->
    </mat-form-field>
    <button mat-button mat-dialog-close>Cancel</button>
    <button  mat-raised-button color="primary"  cdkFocusInitial (click)="ExecuteSteps()">
        Execute
    </button>
</mat-dialog-actions>
