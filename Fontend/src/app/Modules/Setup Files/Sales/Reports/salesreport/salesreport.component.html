<app-template>
    <app-breadcrumb>
      <li class="breadcrumb-item"><a routerLink="/"> Sales</a></li>
      <li class="breadcrumb-item active">Sales Report Dashboard</li>
    </app-breadcrumb>
    
    <div class="row mb-1 g-3">
        <div class="col-12 section-container">
          <div class="row">
            <ng-container *ngFor="let dashboard of section.items">
              <div class="col-md-2 col-sm-4 col-6 mb-3">
                <mat-card matRipple 
                          class="custom-card h-100"
                          [ngClass]="{'disabled': dashboard.disabled}"
                          (click)="onCardClick($event, dashboard.routerLink)">
                  <mat-card-content class="d-flex flex-column align-items-center text-center">
                    <mat-icon class="card-icon mb-2">{{ dashboard.icon }}</mat-icon>
                    <mat-card-subtitle><h5 class="text-center">{{ dashboard.label }}</h5></mat-card-subtitle>
                  </mat-card-content>
                </mat-card>
              </div>
            </ng-container>
          </div>
        </div>
      </div>
  </app-template>
