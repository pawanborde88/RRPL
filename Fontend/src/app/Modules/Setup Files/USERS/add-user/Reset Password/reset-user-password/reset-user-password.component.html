<div class="container-fluid p-0">
    <div class="bg-light p-3 border-bottom d-flex justify-content-between align-items-center">
        <h2 class="h5 mb-0 text-dark">Reset User Password</h2>
        <button mat-icon-button (click)="onCancel()" aria-label="Close dialog">
            <mat-icon>close</mat-icon>
        </button>
    </div>

    <mat-dialog-content class="p-4">
        <form [formGroup]="resetPassword" class="row g-3">
            <mat-form-field appearance="outline" class="col-md-12 w-100">
                <mat-label>New Password</mat-label>
                <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password"
                    placeholder="Enter new password" />
                <button type="button" mat-icon-button matSuffix (click)="hidePassword = !hidePassword"
                    [attr.aria-label]="'Toggle password visibility'" [attr.aria-pressed]="!hidePassword">
                    <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
                </button>

                <mat-error *ngIf="resetPassword.get('password')?.hasError('required')">
                    Password is required
                </mat-error>
                <mat-error *ngIf="resetPassword.get('password')?.hasError('passwordStrength')">
                    Password must include: 
                    <span *ngIf="!resetPassword.get('password')?.errors?.['passwordStrength']?.hasMinLength">
                        minimum 8 characters
                    </span>
                    <span *ngIf="!resetPassword.get('password')?.errors?.['passwordStrength']?.hasMinLength && 
                                 (!resetPassword.get('password')?.errors?.['passwordStrength']?.hasUpperCase || 
                                  !resetPassword.get('password')?.errors?.['passwordStrength']?.hasLowerCase || 
                                  !resetPassword.get('password')?.errors?.['passwordStrength']?.hasNumeric ||
                                  !resetPassword.get('password')?.errors?.['passwordStrength']?.hasSpecialChar)">, </span>
                    <span *ngIf="!resetPassword.get('password')?.errors?.['passwordStrength']?.hasUpperCase">
                        one uppercase letter
                    </span>
                    <span *ngIf="!resetPassword.get('password')?.errors?.['passwordStrength']?.hasUpperCase && 
                                 (!resetPassword.get('password')?.errors?.['passwordStrength']?.hasLowerCase || 
                                  !resetPassword.get('password')?.errors?.['passwordStrength']?.hasNumeric ||
                                  !resetPassword.get('password')?.errors?.['passwordStrength']?.hasSpecialChar)">, </span>
                    <span *ngIf="!resetPassword.get('password')?.errors?.['passwordStrength']?.hasLowerCase">
                        one lowercase letter
                    </span>
                    <span *ngIf="!resetPassword.get('password')?.errors?.['passwordStrength']?.hasLowerCase && 
                                 (!resetPassword.get('password')?.errors?.['passwordStrength']?.hasNumeric ||
                                  !resetPassword.get('password')?.errors?.['passwordStrength']?.hasSpecialChar)">, </span>
                    <span *ngIf="!resetPassword.get('password')?.errors?.['passwordStrength']?.hasNumeric">
                        one number
                    </span>
                    <span *ngIf="!resetPassword.get('password')?.errors?.['passwordStrength']?.hasNumeric && 
                                 !resetPassword.get('password')?.errors?.['passwordStrength']?.hasSpecialChar">, </span>
                    <span *ngIf="!resetPassword.get('password')?.errors?.['passwordStrength']?.hasSpecialChar">
                        one special character (!&#64;#$%^&*)
                    </span>
                </mat-error>
            </mat-form-field>
        </form>
    </mat-dialog-content>

    <mat-dialog-actions align="end" class="p-3 border-top m-0">

        <button mat-raised-button color="primary" (click)="onSubmit()" [disabled]="resetPassword.invalid">
            <mat-icon class="me-1">save</mat-icon>
            Reset Password
        </button>
    </mat-dialog-actions>
</div>
