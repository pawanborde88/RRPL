<mat-card>

  <mat-card-content>
    <div class="row w-100 mt-3 align-items-center">
      <div class="col-12 d-flex flex-wrap align-items-center justify-content-between gap-2">

        <!-- Search Bar -->
        <div class="flex-grow-1 me-2" style="min-width: 220px;">
        </div>

      </div>
    </div>
    <app-reusable-custom-table    [loading]="loading"       
         [idProperty]="'booking_bill_id'"
          [selectedItems]="selectedBooking"
        (selectedItemsChange)="selectedBooking = $event"  (actionClick)="onBookingAction($event.action, $event.row)"  [dataSource]="dataSource" [displayedColumns]="bookingBills" 
      [showFooter]="true" (checkboxChange)="onBookingSelectionChange($event.checked, $event.row)">

    </app-reusable-custom-table>
  </mat-card-content>
</mat-card>
