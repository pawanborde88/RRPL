<app-template>
    <app-breadcrumb>
        <li class="breadcrumb-item ">CP Management</li>
        <li class="breadcrumb-item ">Report</li>

        <li class="breadcrumb-item active">All Channel Partner Report</li>
    </app-breadcrumb>


    <mat-accordion>
        <mat-expansion-panel hideToggle [expanded]="true">
            <mat-expansion-panel-header>
                <mat-panel-title> Advanced Filters </mat-panel-title>
            </mat-expansion-panel-header>

            <form [formGroup]="channelPartnerMeetingForm" class="w-100 g-3">
                <div class="row">
                    <app-autocomplete-reusable-component [isMultiSelect]="true" [options]="projectsList()"
                        formControlName="project_id" class="col-md-3" displayKey="property_name" idKey="project_id"
                        placeholder="Select Project">
                    </app-autocomplete-reusable-component>


                    <app-autocomplete-reusable-component [options]="allChannelPartnerList()" class="col-md-3"
                        formControlName="channel_partner_id" [isMultiSelect]="true" displayKey="full_name"
                        idKey="channel_partner_id" placeholder="Select Partner Firm"
                        (inputChanged)="onPartnerSearch($event)">
                    </app-autocomplete-reusable-component>

                    <div class="col-md-3">
                        <mat-form-field appearance="outline" class="w-100">
                            <mat-label>Report Date</mat-label>
                            <mat-date-range-input [rangePicker]="leadDatePicker">
                                <input matStartDate formControlName="start_date" placeholder="Start date">
                                <input matEndDate formControlName="end_date" placeholder="End date">
                            </mat-date-range-input>
                            <mat-datepicker-toggle matIconSuffix [for]="leadDatePicker"></mat-datepicker-toggle>
                            <mat-date-range-picker #leadDatePicker></mat-date-range-picker>
                        </mat-form-field>
                    </div>

                    <div class="col-md-auto">
                        <button mat-raised-button color="primary" class="d-flex align-items-center w-100"
                            (click)="fetchCPTargetReport()">
                            <mat-icon class="me-1">filter_list</mat-icon> Apply Filter
                        </button>
                    </div>
                </div>
            </form>


        </mat-expansion-panel>
    </mat-accordion>

    <app-configurable-ag-grid-data [columns]="channelPartnerMeetingColumns" [apiEndpoint]="'fetch_all_cp_reports'"
        [apiMethod]="'POST'" [apiPayload]="agGridPayload()" [actions]="channelPartnerActions"
        [idProperty]="'project_id'" [cacheBlockSize]="100" [autoLoad]="false">
    </app-configurable-ag-grid-data>

</app-template>
