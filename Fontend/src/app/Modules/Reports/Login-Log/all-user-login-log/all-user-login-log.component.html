<app-template>
    <app-breadcrumb>
        <li class="breadcrumb-item"><a routerLink="/all-setupDashboard">Setup Dashboard</a></li>

        <li class="breadcrumb-item active">All User Login Log</li>
    </app-breadcrumb>


    <mat-accordion>
        <mat-expansion-panel hideToggle [expanded]="true">
            <mat-expansion-panel-header>
                <mat-panel-title> Advanced Filters </mat-panel-title>
            </mat-expansion-panel-header>

            <form [formGroup]="bookingForm" class="row w-100 g-3">
                <!-- Project Dropdown -->
                <div class="col-md-3">
                    <app-autocomplete-reusable-component formControlName="role_id" [options]="roles()" displayKey="role"
                        idKey="role_id" [isMultiSelect]="true" placeholder="Select Role">
                    </app-autocomplete-reusable-component>
                </div>

                <mat-form-field appearance="outline" class="col-md-3">
                    <mat-label>Select Date</mat-label>
                    <mat-date-range-input [rangePicker]="leadDatePicker">
                        <input matStartDate formControlName="from_date" placeholder="Start date"
                            (click)="leadDatePicker.open()">
                        <input matEndDate formControlName="to_date" placeholder="End date"
                            (click)="leadDatePicker.open()">
                    </mat-date-range-input>
                    <mat-datepicker-toggle matIconSuffix [for]="leadDatePicker"></mat-datepicker-toggle>
                    <mat-date-range-picker #leadDatePicker></mat-date-range-picker>
                </mat-form-field>

                <!-- Apply Filter Button -->
                <div class="col-md-auto">
                    <button mat-raised-button color="primary" class="d-flex align-items-center w-100"
                        (click)="fetchAllBookings()">
                        <mat-icon class="me-1">filter_list</mat-icon> Apply Filter
                    </button>
                </div>
            </form>

        </mat-expansion-panel>
    </mat-accordion>
    <app-configurable-ag-grid-data [loading]="loading()" [columns]="loginLogDisplayedColumns"
        [apiEndpoint]="'fetch_login_logs'" [apiMethod]="'POST'" [apiPayload]="agGridPayload()">
    </app-configurable-ag-grid-data>



</app-template>
