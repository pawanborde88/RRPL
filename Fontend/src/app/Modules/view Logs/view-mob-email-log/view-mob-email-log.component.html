<app-template>
  <app-breadcrumb>
    <li class="breadcrumb-item"><a routerLink="/setup/all-projectleads">All Leads</a></li>

    <li class="breadcrumb-item active">All View Log</li>
  </app-breadcrumb>

  <mat-card>
    <mat-card-header class="d-flex align-items-center">


    </mat-card-header>
    <mat-card-content>
      <mat-progress-bar *ngIf="loading" mode="query"></mat-progress-bar>
      <div class="table-responsive example-container mat-elevation-z8 rounded" *ngIf="dataSource.data.length > 0">
        <table mat-table [dataSource]="dataSource" matSort aria-label="Enquiry Table" class="mat-elevation-z8">

          <ng-container *ngFor="let column of displayedColumns" [matColumnDef]="column.key">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>
              {{ column.label }}
            </th>

            <td mat-cell *matCellDef="let element">
              <ng-container [ngSwitch]="column.key">

                <ng-container *ngSwitchCase="'created_at'">
                  {{ element.created_at | date: 'dd-MM-yyyy' }}
                </ng-container>
                <ng-container *ngSwitchCase="'updated_at'">
                  {{ element.updated_at | date: 'dd-MM-yyyy' }}
                </ng-container>

                <ng-container *ngSwitchDefault>
                  {{ element[column.key] || '-' }}
                </ng-container>
              </ng-container>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="columnKeys"></tr>
          <tr mat-row *matRowDef="let row; columns: columnKeys">
          </tr>

        </table>


        <mat-paginator [class.sticky-column-left]="true" [pageSizeOptions]="[10, 15, 20]" showFirstLastButtons
          aria-label="Select page of Enquiries" color="accent"></mat-paginator>
      </div>
      <div *ngIf="dataSource.data.length === 0" class="alert alert-warning text-center mt-3" role="alert">
        <mat-icon>error</mat-icon>

        <strong>No data available.</strong>
      </div>
    </mat-card-content>

  </mat-card>
</app-template>
