
<mat-card class="mt-3 card-shadow-sm">
  <div [ngClass]="applicantKnownLanguages.length? 'no-border' : 'warning-border'"
  class="card rounded-2 card-shadow-sm  p-4" id="languages">

  <div class="hstack align-items-center mb-3">
    <p class="second-heading-ptag m-0">Languages</p>
    <button mat-button class="ms-auto" (click)="openLanguageDialog('add')" color="primary">Add
      Language</button>
  </div>

  <table *ngIf="applicantKnownLanguages?.length" class="table mb-3 table-sm w-75">
    <thead>
      <tr>
        <th scope="col"></th>
        <th scope="col">Name</th>
        <th scope="col">Read</th>
        <th scope="col">Write</th>
        <th scope="col">Speak</th>
        <th scope="col" class="text-center">Action</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let item of applicantKnownLanguages; let i =index;">
        <th class="col-1 align-middle text-center" scope="row">{{i+1}}</th>
        <td class="col-md-2 align-middle">{{item['language_string']}}</td>
        <td class="col align-middle">{{item['read_language_string']}}</td>
        <td class="col align-middle">{{item['write_language_string']}}</td>
        <td class="col align-middle">{{item['speak_language_string']}}</td>

        <td class="col align-middle text-center">
          <button class="btn btn-sm" [disabled]="deleteLoading" (click)="openLanguageDialog('update',item)"
            type="button">Edit</button>
        </td>
      </tr>
    </tbody>
  </table>

  <app-no-data-error-message [dataArray]="applicantKnownLanguages"
    [noDataErrorMessage]="'Share your language proficiency and known languages to help recruiters understand you better.'"></app-no-data-error-message>

</div>
</mat-card>
