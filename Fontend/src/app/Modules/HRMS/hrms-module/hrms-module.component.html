<app-template>
  <app-breadcrumb>
    <li class="breadcrumb-item active">HRMS Departments</li>
  </app-breadcrumb>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 px-4 py-4">
    <ng-container *ngFor="let dashboard of EnquiryData">
      <div matRipple [class.opacity-50]="dashboard.disable" [class.pointer-events-none]="dashboard.disable"
        (click)="onCardClick($event, dashboard.disable)" [routerLink]="dashboard.disable ? null : dashboard.route"
        class="group relative bg-white/40 backdrop-blur-xl border border-slate-200/50 rounded-3xl p-8 cursor-pointer transition-all duration-500 hover:-translate-y-3 hover:shadow-[0_20px_50px_rgba(8,_112,_184,_0.15)] active:scale-95 flex flex-col items-center justify-center overflow-hidden">
        <!-- Glassmorphism Background Glow -->
        <div
          class="absolute inset-0 bg-gradient-to-br from-white/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500">
        </div>

        <div class="relative z-10 flex flex-col items-center justify-center space-y-5">
          <!-- Icon Container with vibrant glow and animation -->
          <div
            class="w-20 h-20 rounded-2xl flex items-center justify-center transition-all duration-500 group-hover:scale-110 group-hover:rotate-6 shadow-sm"
            [style.background-color]="dashboard.color + '15'">
            <mat-icon class="!text-4xl !w-10 !h-10 transition-all duration-500 group-hover:drop-shadow-lg"
              [style.color]="dashboard.color">
              {{ dashboard.icon }}
            </mat-icon>
          </div>

          <!-- Label with premium typography -->
          <span
            class="text-xl font-bold text-slate-700 tracking-tight group-hover:text-slate-900 transition-colors duration-300">
            {{ dashboard.label }}
          </span>

          <!-- Animated Progress Line -->
          <div class="w-12 h-1 rounded-full bg-slate-200 overflow-hidden">
            <div class="h-full w-0 group-hover:w-full transition-all duration-700 ease-out rounded-full"
              [style.background-color]="dashboard.color"></div>
          </div>
        </div>
      </div>
    </ng-container>
  </div>



</app-template>
