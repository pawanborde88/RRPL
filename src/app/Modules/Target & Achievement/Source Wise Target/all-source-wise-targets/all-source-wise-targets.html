<app-template>
    <app-breadcrumb>

        <li class="breadcrumb-item">Target & Achievement</li>

        <li class="breadcrumb-item active">Source Wise Target list </li>
    </app-breadcrumb>

    <mat-accordion>
        <mat-expansion-panel hideToggle [expanded]="true">
            <mat-expansion-panel-header>

                <mat-panel-title> Advanced Filters </mat-panel-title>
            </mat-expansion-panel-header>
            <form [formGroup]="enquiryFilterForm" class="w-100 g-3">
                <!-- Row for Dropdowns and Date Filter -->
                <div class="row">
                    <div class="col-md-3">
                        <app-autocomplete-reusable-component formControlName="project_id" [options]="projectsList()"
                            displayKey="property_name" idKey="project_id" placeholder="Select Project">
                        </app-autocomplete-reusable-component>
                    </div>

                    <div class="col-md-3">
                        <app-autocomplete-reusable-component formControlName="source_id" [options]="sourcesList()"
                            displayKey="source" idKey="source_id" placeholder="Select Source">
                        </app-autocomplete-reusable-component>

                    </div>

                    <div class="col-md-2">
                        <mat-form-field appearance="outline" class="w-100">
                            <mat-label>From Date</mat-label>
                            <input matInput [matDatepicker]="fromPicker" formControlName="from_date">
                            <mat-datepicker-toggle matIconSuffix [for]="fromPicker"></mat-datepicker-toggle>
                            <mat-datepicker #fromPicker></mat-datepicker>
                        </mat-form-field>
                    </div>

                    <div class="col-md-2">
                        <mat-form-field appearance="outline" class="w-100">
                            <mat-label>To Date</mat-label>
                            <input matInput [matDatepicker]="toPicker" formControlName="to_date">
                            <mat-datepicker-toggle matIconSuffix [for]="toPicker"></mat-datepicker-toggle>
                            <mat-datepicker #toPicker></mat-datepicker>
                        </mat-form-field>
                    </div>

                    <div class="col-md-2">
                        <button mat-raised-button color="primary" (click)="refreshAgGridData()"
                            class="d-flex align-items-center w-100 mt-1">
                            Apply
                        </button>
                    </div>
                </div>
            </form>


        </mat-expansion-panel>
    </mat-accordion>



    <app-configurable-ag-grid-data [columns]="columnDefinitions" [apiEndpoint]="'fetch_source_target'"
        [apiMethod]="'POST'" [apiPayload]="agGridPayload()" [actions]="sourceTargetActions"
        [headerButtons]="headerButtons" [idProperty]="'source_target_id'" [cacheBlockSize]="100" [autoLoad]="false"
        (actionClick)="onSourceTargetAction($event.action, $event.row)">
    </app-configurable-ag-grid-data>

</app-template>
