<table mat-table [dataSource]="dataSource" class="w-100 nested-strategy-table mat-elevation-z0">
    <ng-container matColumnDef="strategy_name">
        <th mat-header-cell *matHeaderCellDef>Strategy</th>
        <td mat-cell *matCellDef="let s">{{ s.strategy_name }}</td>
    </ng-container>
    <ng-container matColumnDef="created_at">
        <th mat-header-cell *matHeaderCellDef>Created</th>
        <td mat-cell *matCellDef="let s">{{ s.created_at | date: 'medium' }}</td>
    </ng-container>
    <ng-container matColumnDef="updated_at">
        <th mat-header-cell *matHeaderCellDef>Updated</th>
        <td mat-cell *matCellDef="let s">{{ s.updated_at | date: 'medium' }}</td>
    </ng-container>
    <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="actions-col"></th>
        <td mat-cell *matCellDef="let s" class="actions-col">
            <button mat-icon-button type="button" color="primary" matTooltip="Edit strategy"
                (click)="$event.stopPropagation(); editStrategy.emit(s)">
                <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button type="button" color="warn" matTooltip="Delete strategy"
                (click)="$event.stopPropagation(); deleteStrategy.emit(s)">
                <mat-icon>delete</mat-icon>
            </button>
        </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns; trackBy: trackByStrategyId"></tr>
</table>
