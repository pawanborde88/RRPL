<app-template>
  <app-breadcrumb>
    <li class="breadcrumb-item active">Leave</li>
  </app-breadcrumb>

  <!-- Leave Balance Section -->
  <div class="mb-8" *ngIf="EnquiryData && EnquiryData.length > 0">
    <h1 class="text-2xl font-bold text-gray-800 mb-6 flex items-center gap-2">
      <mat-icon class="text-primary">account_balance_wallet</mat-icon>
      Leave Balances
    </h1>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
      <div *ngFor="let dashboard of EnquiryData">
        <mat-card matRipple
          class="h-full border-none transition-all duration-300 hover:shadow-lg overflow-hidden relative group"
          [style.background]="'linear-gradient(135deg, ' + dashboard.bg_color + '10 0%, ' + dashboard.bg_color + '25 100%)'">

          <div class="absolute top-0 right-0 p-3 opacity-10 group-hover:scale-110 transition-transform duration-500">
            <mat-icon class="text-7xl" [style.color]="dashboard.bg_color">{{ getLeaveBalanceIcon(dashboard.label)
              }}</mat-icon>
          </div>

          <mat-card-content class="p-4 pt-6">
            <div class="flex flex-col gap-1 relative z-10">
              <span class="text-sm font-medium text-gray-500 uppercase tracking-wider">{{ dashboard.label }}</span>
              <div class="flex items-baseline gap-2">
                <span class="text-3xl font-bold text-gray-800">{{ dashboard.count }}</span>
                <span class="text-gray-400 font-medium">/ {{ dashboard.total }}</span>
              </div>

              <div class="mt-4 h-1.5 w-full bg-gray-100 rounded-full overflow-hidden">
                <div class="h-full transition-all duration-500 rounded-full"
                  [style.width.%]="(dashboard.count / dashboard.total) * 100"
                  [style.background-color]="dashboard.bg_color">
                </div>
              </div>
            </div>
          </mat-card-content>
        </mat-card>
      </div>
    </div>
  </div>

  <!-- Leave Management Section -->
  <div class="mb-8">


    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
      <div *ngFor="let leave of LeaveData">
        <mat-card matRipple [class.opacity-50]="leave.disable" [class.cursor-not-allowed]="leave.disable"
          [class.hover:-translate-y-1]="!leave.disable" (click)="onCardClick($event, leave.disable)"
          [routerLink]="leave.disable ? null : leave.route"
          class="h-full border-none shadow-sm hover:shadow-md transition-all duration-300 overflow-hidden cursor-pointer group">

          <mat-card-content class="p-6">
            <div class="flex items-center gap-4">
              <div
                class="w-12 h-12 rounded-xl bg-primary/5 flex items-center justify-center group-hover:bg-primary group-hover:text-white transition-colors duration-300">
                <mat-icon class="text-primary group-hover:text-white">{{ leave.iconName }}</mat-icon>
              </div>
              <div class="flex flex-col">
                <span
                  class="text-lg font-semibold text-gray-800 group-hover:text-primary transition-colors duration-300">{{
                  leave.label }}</span>
                <span class="text-xs text-gray-400">Manage your {{ leave.label.toLowerCase() }}</span>
              </div>
            </div>
          </mat-card-content>
        </mat-card>
      </div>
    </div>
  </div>
</app-template>
