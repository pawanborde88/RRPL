<h2 mat-dialog-title> {{title}}</h2>
<mat-dialog-content class="mat-typography">
  <form [formGroup]="addHolidayForm" (ngSubmit)="onSubmit()">
    <div class="row p-3" >

      <mat-form-field appearance="outline" class="col-md-6"  >
        <mat-label>Leave Type</mat-label>
        <mat-select formControlName="leave_type_id">
          <mat-option *ngFor="let leave of leaveType" [value]="leave.leave_type_id">
            {{leave.leave_type}}</mat-option>
        </mat-select>
        <mat-error *ngIf="addHolidayForm.controls['leave_type_id'].hasError('required') ">
          Leave Type is required
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="col-md-6" >
        <mat-label>Monthly Credit</mat-label>
        <input matInput type="number" formControlName="monthly_credit">
      </mat-form-field>

      <mat-form-field appearance="outline" class="col-md-6" >
        <mat-label>Annual Credit</mat-label>
        <input matInput type="number" formControlName="annual_credit">
      </mat-form-field>

      <mat-form-field appearance="outline" class="col-md-6" >
        <mat-label>Annual Carry Forward</mat-label>
        <input matInput type="number" formControlName="annual_carry_forward">
      </mat-form-field>

    </div>
  </form>
</mat-dialog-content>

<div mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Close</button>
  <button mat-button type="submit" [disabled]="(!addHolidayForm.valid || loadingState)"
    (click)="onSubmit()">Save</button>
</div>
