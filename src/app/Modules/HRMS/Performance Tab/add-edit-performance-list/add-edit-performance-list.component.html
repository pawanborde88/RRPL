<h2 mat-dialog-title> {{title}}</h2>
<mat-dialog-content class="mat-typography">
  <form [formGroup]="addHolidayForm" (ngSubmit)="onSubmit()">
    <div class="row p-3" >


      <mat-form-field appearance="outline"  class="col-md-6">
        <mat-label>User Name</mat-label>
        <mat-select formControlName="user_id">
            <mat-option *ngFor="let user of AccountUsers" [value]="user.user_id">
                {{user.first_name}} {{user.last_name}}</mat-option>
        </mat-select>
        <mat-error *ngIf="addHolidayForm.controls['user_id'].hasError('required') ">
            Field is required
        </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="col-md-6">
      <mat-label>Parameter</mat-label>
      <mat-select formControlName="parameter_id" (selectionChange)="getRating($event.value)">
        <mat-option *ngFor="let leave of parameter" [value]="leave.parameter_id">
          {{ leave.parameter }}
        </mat-option>
      </mat-select>
      <mat-error *ngIf="addHolidayForm.controls['parameter_id'].hasError('required')">
        Parameter is required
      </mat-error>
    </mat-form-field>


      <mat-form-field appearance="outline" class="col-md-6"  >
        <mat-label>Rating</mat-label>
        <mat-select formControlName="rating">
          <mat-option *ngFor="let scale of rating" [value]="scale.scale">
            {{scale.scale}}</mat-option>
        </mat-select>
        <mat-error *ngIf="addHolidayForm.controls['rating'].hasError('required') ">
          Rating is required
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="col-md-6">
        <mat-label>Date</mat-label>
        <input matInput formControlName="date" [matDatepicker]="date_picker" placeholder="MM/DD/YYYY">
        <mat-datepicker-toggle matSuffix [for]="date_picker"></mat-datepicker-toggle>
        <mat-datepicker #date_picker></mat-datepicker>
      </mat-form-field>

      <mat-form-field appearance="outline" class="col-md-6" >
        <mat-label>comment</mat-label>
        <input matInput  formControlName="comment">
      </mat-form-field>
    </div>
  </form>
</mat-dialog-content>

<div mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Close</button>
  <button mat-button type="submit" [disabled]="(!addHolidayForm.valid || loadingState)"
    (click)="onSubmit()">Save</button>
</div>
