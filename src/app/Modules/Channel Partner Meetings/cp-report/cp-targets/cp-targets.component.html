<app-template>
    <app-breadcrumb>
        <li class="breadcrumb-item ">CP Management</li>
        <li class="breadcrumb-item ">Report</li>

        <li class="breadcrumb-item active">Channel Partner Target</li>
    </app-breadcrumb>
    <mat-accordion>
        <mat-expansion-panel hideToggle [expanded]="true"> <mat-panel-title> Advanced Filters
            </mat-panel-title>

            <mat-expansion-panel-header>
                <mat-panel-title> Advanced Filters </mat-panel-title>
            </mat-expansion-panel-header>

            <form [formGroup]="channelPartnerMeetingForm" class=" w-100 g-3 align-items-end">
                <div class="row">
                    <app-autocomplete-reusable-component [isMultiSelect]="true" [options]="projectsList()"
                        formControlName="project_id" class="col-md-2" displayKey="property_name" idKey="project_id"
                        placeholder="Select Project">
                    </app-autocomplete-reusable-component>
                    <mat-form-field appearance="outline" class="col-md-2">
                        <mat-label>Sourcing Manager</mat-label>
                        <mat-select formControlName="sourcing_manger_id" multiple>
                            <mat-option *ngFor="let manager of allSourcingManagerDropdown()" [value]="manager.user_id">
                                {{ manager.first_name }} {{ manager.last_name }}
                            </mat-option>
                        </mat-select>

                    </mat-form-field>
                    <mat-form-field appearance="outline" class="col-md-2">
                        <mat-label>select Director</mat-label>
                        <mat-select formControlName="director_id" multiple>
                            <mat-option *ngFor="let director of allDirectorDropdown()" [value]="director.user_id">
                                {{ director.first_name }} {{ director.last_name }}
                            </mat-option>
                        </mat-select>
                    </mat-form-field>

                    <div class="col-md-2">
                        <mat-form-field appearance="outline" class="w-100">
                            <mat-label>Report Date</mat-label>
                            <mat-date-range-input [rangePicker]="leadDatePicker">
                                <input matStartDate formControlName="start_date" placeholder="Start date">
                                <input matEndDate formControlName="end_date" placeholder="End date">
                            </mat-date-range-input>
                            <mat-datepicker-toggle matIconSuffix [for]="leadDatePicker"></mat-datepicker-toggle>
                            <mat-date-range-picker #leadDatePicker></mat-date-range-picker>
                        </mat-form-field>
                    </div>

                    <div class="col-md-auto">
                        <button mat-raised-button color="primary" class="d-flex align-items-center w-100"
                            (click)="fetchCPTargetReport()" [disabled]="!channelPartnerMeetingForm.valid">
                            <mat-icon class="me-1">filter_list</mat-icon> Apply Filter
                        </button>
                    </div>
                </div>
            </form>


        </mat-expansion-panel>
    </mat-accordion>
    <app-configurable-ag-grid-data [columns]="columnDefinitions" [apiEndpoint]="'fetch_all_cp_target'"
        [apiMethod]="'POST'" [headerButtons]="headerButtons" [apiPayload]="agGridPayload()"
        [actions]="channelPartnerActions" [idProperty]="'project_id'" [cacheBlockSize]="100" [autoLoad]="false"
        (actionClick)="onBookingAction($event.action, $event.row)">
    </app-configurable-ag-grid-data>
</app-template>
