<div class="dialog-container">
  <!-- Use computed signal for dialog title from store -->
  <h2 mat-dialog-title>{{ store.dialogTitle() }}

    <button mat-icon-button mat-dialog-close style="position: absolute; top: 10px; right: 12px;">
      <mat-icon>close</mat-icon>
    </button>
  </h2>

  <mat-dialog-content>
    <!-- Configurable AG Grid Data Component -->
    @if (store.apiEndpoint()) {
    <div class="table-container">
      <app-configurable-ag-grid-data [columns]="store.columnDefinitions()" [apiEndpoint]="store.apiEndpoint()"
        [apiMethod]="'POST'" [apiPayload]="store.agGridPayload()" [actions]="[]" [idProperty]="store.idProperty()"
        [cacheBlockSize]="100" [autoLoad]="true">
      </app-configurable-ag-grid-data>
    </div>
    }
  </mat-dialog-content>


</div>
