<h6 mat-dialog-title class="dialog-title">
    {{ data.title || 'RERA Approval' }}
    <!-- Card View only: removed toggle buttons for table/card switch -->
    <button mat-icon-button mat-dialog-close style="position: absolute; top: 10px; right: 12px;">
        <mat-icon>close</mat-icon>
    </button>
</h6>

<mat-dialog-content>
    <div class="flex flex-col gap-6">
        <!-- Info Card -->
        <div class="bg-gray-50 border border-gray-200 rounded-lg p-4">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <span class="text-xs text-gray-500 uppercase font-semibold tracking-wider">Firm Name</span>
                    <div class="text-sm font-medium text-gray-800 mt-1">{{ data.data.firm_name || 'N/A' }}</div>
                </div>
                <div>
                    <span class="text-xs text-gray-500 uppercase font-semibold tracking-wider">RERA Number</span>
                    <div class="text-sm font-medium text-gray-800 mt-1">{{ data.data.rera || 'N/A' }}</div>
                </div>
            </div>
        </div>

        <!-- Toggle Group for Status -->
        <form [formGroup]="form" class="flex flex-col gap-3">
            <mat-label class="text-sm font-semibold text-gray-700">Approval Status</mat-label>
            <mat-button-toggle-group formControlName="rera_approvel_id" class="w-full flex">
                <mat-button-toggle [value]="1" class="flex-1 text-center"
                    [ngClass]="{'bg-green-50': form.get('rera_approvel_id')?.value === 1}">
                    <div class="flex items-center justify-center gap-2 py-1">
                        <mat-icon class="text-green-600"
                            *ngIf="form.get('rera_approvel_id')?.value === 1">check_circle</mat-icon>
                        <span
                            [ngClass]="{'text-white font-semibold': form.get('rera_approvel_id')?.value === 1}">Approve</span>
                    </div>
                </mat-button-toggle>
                <mat-button-toggle [value]="2" class="flex-1 text-center"
                    [ngClass]="{'bg-red-50': form.get('rera_approvel_id')?.value === 2}">
                    <div class="flex items-center justify-center gap-2 py-1">
                        <mat-icon class="text-red-600"
                            *ngIf="form.get('rera_approvel_id')?.value === 2">cancel</mat-icon>
                        <span
                            [ngClass]="{'text-white font-semibold': form.get('rera_approvel_id')?.value === 2}">Unapprove</span>
                    </div>
                </mat-button-toggle>
            </mat-button-toggle-group>
            <mat-error
                *ngIf="form.get('rera_approvel_id')?.touched && form.get('rera_approvel_id')?.hasError('required')"
                class="text-xs">
                Please select a status
            </mat-error>

            <mat-form-field appearance="outline" class="w-full mt-2">
                <mat-label>Remark</mat-label>
                <input matInput formControlName="rera_comment" placeholder="Enter Approver Comment..." />
                <mat-error *ngIf="form.get('rera_comment')?.touched && form.get('rera_comment')?.hasError('required')"
                    class="text-xs">
                    Please enter a Approver Comment
                </mat-error>
            </mat-form-field>
        </form>
    </div>
</mat-dialog-content>

<mat-dialog-actions align="end" class="p-4 border-t">
    <button mat-flat-button color="primary" (click)="onSubmit()" [disabled]="form.invalid || isLoading">
        {{ isLoading ? 'Submitting...' : 'Submit' }}
    </button>
</mat-dialog-actions>
