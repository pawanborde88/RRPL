<h2 mat-dialog-title>Assign Source Executive
    <button mat-icon-button type="button" (click)="onClose()" style="position: absolute; top: 10px; right: 12px;">
        <mat-icon>close</mat-icon>
    </button>
</h2>
<mat-dialog-content [formGroup]="form">
    <p class="mt-2">Assigning Sourcing Executive to <strong>{{store.partnerNames()}}</strong></p>
    <app-autocomplete-reusable-component formControlName="project_id" [options]="store.projects()"
        displayKey="property_name" idKey="project_id"  placeholder="Select Project">
    </app-autocomplete-reusable-component>
    <app-autocomplete-reusable-component [options]="store.executives()"
        formControlName="source_executive_id" [isMultiSelect]="true" displayKey="full_name" idKey="user_id"
        placeholder=" Select Sourcing Executive">
    </app-autocomplete-reusable-component>
    @if (store.error()) {
    <p class="text-danger mt-2">{{store.error()}}</p>
    }
</mat-dialog-content>
<mat-dialog-actions align="end">
    <button mat-raised-button color="primary" [disabled]="form.invalid || store.loading()" (click)="onAssign()">
        {{ store.loading() ? 'Assigning...' : 'Assign' }}
    </button>
</mat-dialog-actions>
