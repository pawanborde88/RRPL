<h2 mat-dialog-title>CP Bill Approval Log
  <button mat-icon-button mat-dialog-close style="position: absolute; top: 10px; right: 12px;">
    <mat-icon>close</mat-icon>
  </button>
</h2>

<mat-dialog-content>

  <div *ngIf="!loading && approvalLogs.length === 0" class="no-data">
    <p>No approval logs found.</p>
  </div>


  <app-reusable-custom-table [loading]="false" [idProperty]="'bill_approval_log_id'" [dataSource]="dataSource"
    [displayedColumns]="displayedColumns" [showFooter]="true" aria-label="Bill Approval Logs">
  </app-reusable-custom-table>

</mat-dialog-content>
