<app-template>
    <app-breadcrumb>
        <li class="breadcrumb-item">Channel Partner</li>
        <li class="breadcrumb-item active">CP Payout</li>
    </app-breadcrumb>

    <mat-accordion>
        <mat-expansion-panel hideToggle [expanded]="true">
            <mat-expansion-panel-header>
                <mat-panel-title> Advanced Filters </mat-panel-title>
            </mat-expansion-panel-header>

            <form [formGroup]="bookingForm" class="row w-100 g-3">
                <!-- Project Dropdown -->
                <div class="col-md-3">
                    <app-autocomplete-reusable-component [options]="projectsList()" formControlName="project_id"
                        displayKey="property_name" idKey="project_id" placeholder="Select Project">
                    </app-autocomplete-reusable-component>
                </div>

                <!-- Approval Level Dropdown -->
                <mat-form-field appearance="outline" class="col-md-3">
                    <mat-label>Select Level</mat-label>
                    <mat-select formControlName="approval_level_id">
                        <mat-option *ngFor="let level of approvalLevels(); trackBy: trackByApprovalLevelId"
                            [value]="level.approval_level_id">
                            {{ level.approval_level }}
                        </mat-option>
                    </mat-select>
                </mat-form-field>

                <!-- Apply Filter Button -->
                <div class="col-md-auto">
                    <button mat-raised-button color="primary" class="d-flex align-items-center w-100"
                        [disabled]="!bookingForm.get('project_id')?.value" (click)="searchCPPayout()">
                        <mat-icon class="me-1">filter_list</mat-icon> Apply Filter
                    </button>
                </div>
            </form>
        </mat-expansion-panel>
    </mat-accordion>

    <mat-tab-group aria-label="CP Payout status tabs" (selectedTabChange)="onTabChange($event)"
        [selectedIndex]="selectedTabIndex()">
        <!-- Pending Approval Tab -->
        <mat-tab label="Pending Approval" aria-label="Pending approval bills">
            <ng-template matTabContent>
                <app-configurable-ag-grid-data [loading]="loading()" [columns]="bookingBillsColumns"
                    [apiEndpoint]="'fetch_all_booking_bill'" [apiMethod]="'POST'"
                    [apiPayload]="apiPayloadPendingApproval()" [actions]="bookingActions()"
                    [headerButtons]="headerButtons()" [showCheckbox]="true" [cacheBlockSize]="100"
                    [idProperty]="'booking_bill_id'" [selectedItems]="selectedBooking()"
                    (actionClick)="onBookingAction($event.action, $event.row)"
                    (rowSelected)="onRowSelected($event)"
                    (checkboxChange)="onBookingSelectionChange($event.checked, $event.row)">
                </app-configurable-ag-grid-data>
            </ng-template>
        </mat-tab>

        <!-- Pending Payment Tab -->
        <mat-tab label="Pending Payment" aria-label="Pending payment bills">
            <ng-template matTabContent>
                <app-configurable-ag-grid-data [loading]="loading()" [columns]="bookingBillsColumns"
                    [apiEndpoint]="'fetch_all_booking_bill'" [apiMethod]="'POST'"
                    [apiPayload]="apiPayloadPendingPayment()" [actions]="bookingActions()"
                    [headerButtons]="headerButtons()" [showCheckbox]="true" [cacheBlockSize]="100"
                    [idProperty]="'booking_bill_id'" [selectedItems]="selectedBooking()"
                    (actionClick)="onBookingAction($event.action, $event.row)"
                    (rowSelected)="onRowSelected($event)"
                    (checkboxChange)="onBookingSelectionChange($event.checked, $event.row)">
                </app-configurable-ag-grid-data>
            </ng-template>
        </mat-tab>

        <!-- Paid Bills Tab -->
        <mat-tab label="Paid Bills" aria-label="Paid bills">
            <ng-template matTabContent>
                <app-configurable-ag-grid-data [loading]="loading()" [columns]="bookingBillsColumns"
                    [apiEndpoint]="'fetch_all_booking_bill'" [apiMethod]="'POST'"
                    [apiPayload]="apiPayloadPaidBills()" [actions]="bookingActions()"
                    [headerButtons]="headerButtons()" [showCheckbox]="true" [cacheBlockSize]="100"
                    [idProperty]="'booking_bill_id'" [selectedItems]="selectedBooking()"
                    (actionClick)="onBookingAction($event.action, $event.row)"
                    (rowSelected)="onRowSelected($event)"
                    (checkboxChange)="onBookingSelectionChange($event.checked, $event.row)">
                </app-configurable-ag-grid-data>
            </ng-template>
        </mat-tab>
    </mat-tab-group>
</app-template>
