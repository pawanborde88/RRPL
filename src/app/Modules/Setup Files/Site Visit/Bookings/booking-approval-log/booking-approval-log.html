<app-template>
    <app-breadcrumb>
        <li class="breadcrumb-item">Sales Management</li>
        <li class="breadcrumb-item"> Bookings</li>
        <li class="breadcrumb-item active">All Bookings Approval Log</li>
    </app-breadcrumb>

    <mat-accordion>
        <mat-expansion-panel hideToggle [expanded]="true">
            <mat-expansion-panel-header>
                <mat-panel-title> Advanced Filters </mat-panel-title>
            </mat-expansion-panel-header>

            <form [formGroup]="bookingForm" class="row ">
                <!-- Project Dropdown -->
                <div class="col-md-3">
                    <app-autocomplete-reusable-component [options]="projectsList()" formControlName="project_id"
                        displayKey="property_name" idKey="project_id" placeholder="Select Project">
                    </app-autocomplete-reusable-component>
                </div>


                <!-- Apply Filter Button -->
                <div class="col-md-auto">
                    <button mat-raised-button color="primary" class="d-flex align-items-center w-100"
                        [disabled]="!bookingForm.valid" (click)="fetchAllBookings()">
                        <mat-icon class="me-1">filter_list</mat-icon> Apply Filter
                    </button>
                </div>
            </form>


        </mat-expansion-panel>
    </mat-accordion>
    <app-configurable-ag-grid-data [columns]="columns" [apiEndpoint]="apiEndpoint" [apiMethod]="'POST'"
        [apiPayload]="payload()" [actions]="actions" (actionClick)="onBookingAction($event.action, $event.row)">
    </app-configurable-ag-grid-data>

</app-template>
