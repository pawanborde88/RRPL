<h6 mat-dialog-title>All Receipts

  <button mat-icon-button mat-dialog-close style="position: absolute; top: 10px; right: 12px;">
    <mat-icon>close</mat-icon>
  </button>
</h6>
<mat-dialog-content>
  <app-configurable-ag-grid-data [columns]="bookingReciptColumns" [actions]="reciptActions"
    [headerButtons]="headerButtons" apiEndpoint="fetch_all_booking_receipt" [apiPayload]="agGridPayload()"
    idProperty="booking_receipt_id" [showCheckbox]="true" [autoLoad]="true"
    (actionClick)="onReciptActions($event.action, $event.row)" (rowSelected)="onSelectedItemsChange($event)">
  </app-configurable-ag-grid-data>
</mat-dialog-content>
<mat-dialog-actions>
</mat-dialog-actions>
