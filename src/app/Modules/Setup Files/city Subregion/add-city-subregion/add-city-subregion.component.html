<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content class="mat-typography">
    <form [formGroup]="addCitySubRegionForm"  class="row g-3 align-items-center">

        <!-- City Name Input (Visible if 'multiple' is 'city') -->
        <mat-form-field appearance="outline" class="col-md-12" *ngIf="data.multiple === 'city'">
            <mat-label>City Name</mat-label>
            <input matInput formControlName="city_name" />
            <mat-error *ngIf="addCitySubRegionForm.get('city_name')?.hasError('required')">
                City Name is required
            </mat-error>
        </mat-form-field>

        <!-- Select City Dropdown (Visible if 'multiple' is 'subRegion') -->
        <mat-form-field appearance="outline" class="col-md-6" *ngIf="data.multiple === 'subRegion'">
            <mat-label>Select City</mat-label>
            <mat-select formControlName="city_id">
                <mat-option *ngFor="let city of allCitys" [value]="city.city_id">
                    {{ city.city_name }}
                </mat-option>
            </mat-select>
            <mat-error *ngIf="addCitySubRegionForm.get('city_id')?.hasError('required')">
                City selection is required
            </mat-error>
        </mat-form-field>

        <!-- Chip List for Adding Subregions (Only for 'Add Subregion') -->
        <mat-form-field class="example-chip-list col-md-6" *ngIf="data.title === 'Add Subregion'">
            <mat-chip-grid #chipGrid aria-label="Enter subregions">
                <!-- Display Existing Subregions as Chips -->
                <mat-chip-row *ngFor="let subRegion of AllSubRegions" (removed)="remove(subRegion)">
                    {{ subRegion }}
                    <button matChipRemove [attr.aria-label]="'Remove ' + subRegion">
                        <mat-icon>cancel</mat-icon>
                    </button>
                </mat-chip-row>

                <!-- Input Field to Add New Subregions -->
                <input placeholder="Add subRegion..." #tagInput (keyup.enter)="$event.stopPropagation()"
                    [matChipInputFor]="chipGrid" [matChipInputSeparatorKeyCodes]="separatorKeysCodes"
                    [matChipInputAddOnBlur]="addOnBlur" (matChipInputTokenEnd)="addTagsToArray(tagInput)" />
            </mat-chip-grid>
        </mat-form-field>

        <!-- Input Field for Editing Subregion (Only for 'Edit Sub Region') -->
        <mat-form-field appearance="outline" class="col-md-6" *ngIf="data.title === 'Edit Subregion'">
            <mat-label>Sub Region</mat-label>
            <input matInput formControlName="sub_regions" />
            <mat-error *ngIf="addCitySubRegionForm.get('sub_regions')?.hasError('required')">
                Sub Region is required
            </mat-error>
        </mat-form-field>

        <!-- Dialog Actions -->
      
    </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
    <button mat-raised-button color="primary" (click)="onSubmit()" type="submit">
        Save
    </button>
    <button mat-button mat-dialog-close>Cancel</button>
</mat-dialog-actions>
