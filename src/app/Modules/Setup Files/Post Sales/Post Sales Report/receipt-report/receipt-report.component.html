<app-template>
    <app-breadcrumb>
        <li class="breadcrumb-item">After Sales</li>
        <li class="breadcrumb-item">Reports</li>
        <li class="breadcrumb-item active">Receipts Report</li>
    </app-breadcrumb>




    <mat-accordion>
        <mat-expansion-panel hideToggle [expanded]="true" [expanded]="true">
            <mat-expansion-panel-header>
                <mat-panel-title> Advanced Filters </mat-panel-title>
            </mat-expansion-panel-header>
            <form [formGroup]="filterForm">
                <div class="row mt-2">
                    <div class="col-md-3">
                        <app-autocomplete-reusable-component [options]="projectsList()" formControlName="project_id"
                            displayKey="property_name" idKey="project_id" [isMultiSelect]="true"
                            placeholder="Select Project">
                        </app-autocomplete-reusable-component>
                    </div>

                    <div class="col-md-3">
                        <mat-form-field appearance="outline">
                            <mat-label>Select Wing</mat-label>
                            <mat-select formControlName="wing_id">
                                <mat-option [value]="null">All Wings</mat-option>
                                <mat-option *ngFor="let wing of allWingslist(); trackBy: trackByWingId"
                                    [value]="wing.wing_id">
                                    {{ wing.wing_name }}
                                </mat-option>
                            </mat-select>
                        </mat-form-field>
                    </div>


                    <app-autocomplete-reusable-component class="col-md-3" [options]="receiptTypeList()"
                        formControlName="receipt_type_id" displayKey="receipt_type" idKey="receipt_type_id"
                        [isMultiSelect]="true" placeholder="Select Receipt Type">
                    </app-autocomplete-reusable-component>

                    <div class="col-md-3">
                        <button mat-raised-button color="primary" (click)="fetchAllReceipts()"
                            [disabled]=" filterForm.invalid ">
                            <span *ngIf="loading()">Loading...</span>
                            <span *ngIf="!loading()">Filter</span>
                        </button>
                    </div>
                </div>
            </form>

        </mat-expansion-panel>
    </mat-accordion>

    <app-configurable-ag-grid-data [columns]="columnDefinitions" [apiEndpoint]="'fetch_all_booking_receipt_report'"
        [apiPayload]="agGridPayload()">
    </app-configurable-ag-grid-data>
</app-template>
