<app-template>
    <app-breadcrumb>
        <li class="breadcrumb-item ">After Sales</li>

        <li class="breadcrumb-item ">Reports</li>

        <li class="breadcrumb-item active">Stages Payment Report</li>
    </app-breadcrumb>
    <mat-card>
        <mat-card-content>
            <!-- Project and Wing selectors remain in parent -->
            <div class="row align-items-center w-100 ">
                <!-- Project Selection -->
                <div class="col-md-3 mb-2 mb-md-0">
                    <app-autocomplete-reusable-component class="w-25" [options]="projectsList" idKey="project_id"
                        displayKey="property_name" placeholder="Select Project"
                        (selectedIdChange)="onProjectChange($event)">
                    </app-autocomplete-reusable-component>
                </div>

                <!-- Wing Selection -->
                <div class="col-md-3  mb-md-0">
                    <mat-form-field appearance="outline">
                        <mat-label>Select Wing</mat-label>
                        <mat-select (selectionChange)="onWingChange($event.value)" [disabled]="!allWingslist.length">
                            <mat-option *ngFor="let wing of allWingslist" [value]="wing.wing_id">
                                {{ wing.wing_name }}
                            </mat-option>
                        </mat-select>
                    </mat-form-field>
                </div>
            </div>

            <app-reusable-custom-table [loading]="loading" [dataSource]="dataSource"
                [displayedColumns]="displayedColumns" [showFooter]="true">
            </app-reusable-custom-table>
        </mat-card-content>
    </mat-card>
</app-template>
