<h2 mat-dialog-title>Update Stages
    <button mat-icon-button mat-dialog-close style="position: absolute; top: 10px; right: 12px;">
        <mat-icon>close</mat-icon>
    </button>
</h2>
<mat-card-content>
    <form [formGroup]="addpaymentStages" class="row ">
        <!-- PROJECT DETAILS -->
        <div class="col-md-4">
            <app-autocomplete-reusable-component [options]="projectsList" formControlName="project_id"
                displayKey="property_name" idKey="project_id" placeholder="Select Project">
            </app-autocomplete-reusable-component>
        </div>

        <div class="col-md-4">
            <mat-form-field appearance="outline">
                <mat-label>Select Wing</mat-label>
                <mat-select formControlName="wing_id">
                    <mat-option *ngFor="let allwings of allWingslist" [value]="allwings.wing_id">
                        {{ allwings.wing_name }}
                    </mat-option>
                </mat-select>
            </mat-form-field>
        </div>
        <div class="col-md-2">
            <button mat-raised-button color="primary" (click)="onAdd()"
                [disabled]="isTotalPercentageFull || !addpaymentStages.valid">
                Add
            </button>
        </div>

        <!-- Clone Section - Only show when stages are selected -->
        <div class="col-12 mt-3" *ngIf="selectedStages.length > 0">
            <div class="row">
                <div class="col-md-4">
                    <app-autocomplete-reusable-component [options]="allWingslist" [isMultiSelect]="true"
                        class="col-md-12" formControlName="clone_wing_id" displayKey="wing_name" idKey="wing_id"
                        placeholder="Select Wings for Clone">
                    </app-autocomplete-reusable-component>
                </div>
                <div class="col-md-2">
                    <button mat-raised-button color="accent" (click)="onCloneStages()"
                        [disabled]="!addpaymentStages.get('clone_wing_id')?.value || selectedStages.length === 0">
                        <mat-icon>content_copy</mat-icon>
                        Clone
                    </button>
                </div>
            </div>
        </div>
    </form>
    <app-reusable-custom-table [loading]="loading" [dataSource]="dataSource"
        [displayedColumns]="bookingDisplayedColumns" [actions]="bookingActions" (editEvent)="onEditEvent($event)"
        [showFooter]="true" [showCheckbox]="true" [idProperty]="'payment_stage_id'"
        (selectedItemsChange)="selectedStages = $event" (onActionClick)="onBookingAction($event.action, $event.row)"
        [selectedItems]="selectedStages" (checkboxChange)="onBookingSelectionChange($event.checked, $event.row)">
    </app-reusable-custom-table>
</mat-card-content>
