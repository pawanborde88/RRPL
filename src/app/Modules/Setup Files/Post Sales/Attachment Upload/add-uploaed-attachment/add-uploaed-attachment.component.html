<h2 mat-dialog-title>Edit Client Documents
    <button mat-icon-button mat-dialog-close style="position: absolute; top: 10px; right: 12px;">
        <mat-icon>close</mat-icon>
    </button>
</h2>

<mat-dialog-content>
    <form [formGroup]="form" class="row g-3">
        <div class="col-md-4">
            <app-autocomplete-reusable-component [options]="projects()" formControlName="project_id"
                displayKey="property_name" idKey="project_id" placeholder="Select Project" class="w-100">
            </app-autocomplete-reusable-component>
        </div>

        <div class="col-md-4">
            <mat-form-field appearance="outline" class="w-100">
                <mat-label>Select Wing</mat-label>
                <mat-select formControlName="wing_id">
                    <mat-option *ngFor="let wing of wings()" [value]="wing.wing_id">
                        {{ wing.wing_name }}
                    </mat-option>
                </mat-select>
                <mat-error *ngIf="form.get('wing_id')?.hasError('required') && form.get('wing_id')?.touched">
                    Wing is required
                </mat-error>
            </mat-form-field>
        </div>

        <div class="col-md-4">
            <app-autocomplete-reusable-component [options]="units()" formControlName="floor_unit_id"
                displayKey="full_name" idKey="floor_unit_id" placeholder="Select Unit" class="w-100">
            </app-autocomplete-reusable-component>
        </div>

        <div class="col-md-4">
            <mat-form-field appearance="outline" class="w-100">
                <mat-label>Attachment Master</mat-label>
                <mat-select formControlName="attachment_type_id" required>
                    <mat-option *ngFor="let docMaster of docMasters()" [value]="docMaster.doc_master_id">
                        {{ docMaster.doc_name }}
                    </mat-option>
                </mat-select>
                <mat-error
                    *ngIf="form.get('attachment_type_id')?.hasError('required') && form.get('attachment_type_id')?.touched">
                    Attachment type is required
                </mat-error>
            </mat-form-field>
        </div>

        <div class="col-md-4">
            <label class="form-label d-block mb-2">Upload File</label>
            <input #fileInput type="file" class="form-control" (change)="onFileChange($event, 'attachment')"
                accept="*/*" style="display: none;" />
            <button mat-stroked-button type="button" (click)="fileInput.click()" class="w-100">
                <mat-icon>attach_file</mat-icon>
                Choose File
            </button>
            <small class="text-muted d-block mt-1" *ngIf="selectedFileName() || existingFileName()">
                Selected: {{ selectedFileName() || existingFileName() }}
            </small>
        </div>
    </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-raised-button color="primary" (click)="onSubmit()" type="submit" class="me-2"
        [disabled]="form.get('project_id')?.invalid || form.get('wing_id')?.invalid || form.get('floor_unit_id')?.invalid || form.get('attachment_type_id')?.invalid || form.get('attachment')?.invalid">
        <span *ngIf="loading()">Uploading...</span>
        <span *ngIf="!loading()">Submit</span>
    </button>
</mat-dialog-actions>
