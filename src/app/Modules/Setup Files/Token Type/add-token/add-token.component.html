<h2 mat-dialog-title>{{ data.title }} 
    <button mat-icon-button mat-dialog-close style="position: absolute; top: 10px; right: 12px;">
        <mat-icon>close</mat-icon>
    </button>
</h2>

<mat-dialog-content class="mat-typography">
    <form [formGroup]="addTokenTypeForm" (ngSubmit)="onSubmit()" class="row g-3 align-items-center">

        <mat-form-field appearance="outline" class="col-md-4">
            <mat-label>Project</mat-label>
            <mat-select formControlName="project_id">
                <mat-option *ngFor="let project of projectsList" [value]="project.project_id">
                    {{ project.property_name }}
                </mat-option>
            </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline" class="col-md-4">
            <mat-label>Token Type</mat-label>
            <input matInput formControlName="token_type" />
        </mat-form-field>
        <mat-form-field appearance="outline" class="col-md-4">
            <mat-label>Amount</mat-label>
            <input matInput formControlName="amount">

        </mat-form-field>
                <mat-form-field appearance="outline" class="col-md-4">
            <mat-label>Token Start From</mat-label>
            <input matInput type="number" formControlName="token_start_no">

        </mat-form-field>

        <mat-form-field appearance="outline" class="col-md-4">
            <mat-label>Active Status</mat-label>
            <mat-select formControlName="active_status_id">
                <mat-option [value]="1">Active</mat-option>
                <mat-option [value]="0">Inactive</mat-option>
            </mat-select>
        </mat-form-field>
        <div class="col-md-4">
            <mat-checkbox formControlName="enforced_flat_selection">Enforced Flat Selection</mat-checkbox>
        </div>
        <div class="col-md-4">
            <mat-checkbox formControlName="is_highest">Is Highest</mat-checkbox>
        </div>

        <mat-dialog-actions align="end">
            <button mat-raised-button color="primary" type="submit">
                Save
            </button>
        </mat-dialog-actions>
    </form>
</mat-dialog-content>
