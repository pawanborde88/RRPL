<app-template>
    <app-breadcrumb>
        <li class="breadcrumb-item">Lead Management</li>
        <li class="breadcrumb-item">Reports</li>
        <li class="breadcrumb-item active">Lead Transfer Report</li>
    </app-breadcrumb>


    <mat-accordion>
        <mat-expansion-panel hideToggle [expanded]="true">
            <mat-expansion-panel-header>
                <mat-panel-title> Advanced Filters </mat-panel-title>
            </mat-expansion-panel-header>

            <form [formGroup]="leadForm">
                <div class="row">
                    <div class="col-md-3">
                        <app-autocomplete-reusable-component class="w-25" [options]="projectsList()" idKey="project_id"
                            displayKey="property_name" placeholder="Select Project" [isMultiSelect]="true"
                            formControlName="project_id">
                        </app-autocomplete-reusable-component>
                    </div>
                    <div class="col-md-3">
                        <app-autocomplete-reusable-component *ngIf="roleId() !== 13" class="w-25"
                            [options]="allTelecallerlist()" idKey="user_id" displayKey="full_name"
                            placeholder="Select Telecaller To" [isMultiSelect]="true" formControlName="transfer_to">
                        </app-autocomplete-reusable-component>
                    </div>
                    <div class="col-md-3">
                        <app-autocomplete-reusable-component *ngIf="roleId() !== 13" class="w-25"
                            [options]="allTelecallerlist()" idKey="user_id" displayKey="full_name"
                            placeholder="Select Telecaller From" [isMultiSelect]="true" formControlName="transfer_from">
                        </app-autocomplete-reusable-component>
                    </div>
                    <div class="col-md-3">
                        <button mat-raised-button color="primary" type="button"
                            [disabled]="!leadForm.get('project_id')?.value?.length" (click)="applyFilters()">
                            Apply Filter
                        </button>
                    </div>
                </div>
            </form>



        </mat-expansion-panel>
    </mat-accordion>

    <app-configurable-ag-grid-data [columns]="columnDefinitions" [apiEndpoint]="'fetch_all_assigned_lead_logs'"
        [apiPayload]="agGridPayload()">
    </app-configurable-ag-grid-data>
</app-template>
