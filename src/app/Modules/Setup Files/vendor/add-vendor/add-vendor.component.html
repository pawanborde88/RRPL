<h2 mat-dialog-title>Add new Vendors
  <button mat-icon-button mat-dialog-close style="position: absolute; top: 10px; right: 12px;">
    <mat-icon>close</mat-icon>
  </button>
</h2>

<mat-dialog-content class="mat-typography">
  <form [formGroup]="addVendorForm" class="row mt-1">

    <div class="col-4">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Vendor Name</mat-label>
        <input matInput formControlName="vendor_name">
        <mat-error *ngIf="addVendorForm.get('vendor_name')?.invalid && addVendorForm.get('vendor_name')?.touched">
          Vendor Name is required
        </mat-error>
      </mat-form-field>
    </div>

    <div class="col-4">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Contact Person Name</mat-label>
        <input matInput formControlName="contact_person_name">
        <mat-error
          *ngIf="addVendorForm.get('contact_person_name')?.invalid && addVendorForm.get('contact_person_name')?.touched">
          Contact Person Name is required
        </mat-error>
      </mat-form-field>
    </div>

    <div class="col-4">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Contact No</mat-label>
        <input matInput formControlName="contact_no" type="tel">
        <mat-error *ngIf="addVendorForm.get('contact_no')?.invalid && addVendorForm.get('contact_no')?.touched">
          Contact No is required
        </mat-error>
      </mat-form-field>
    </div>

    <div class="col-4">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Select Status</mat-label>
        <mat-select formControlName="status_id">
          <mat-option [value]="1">Active</mat-option>
          <mat-option [value]="2">Inactive</mat-option>
        </mat-select>
        <mat-error *ngIf="addVendorForm.get('status_id')?.invalid && addVendorForm.get('status_id')?.touched">
          Source detail is required
        </mat-error>
      </mat-form-field>
    </div>

    <div class="col-4">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>GST Number</mat-label>
        <input matInput formControlName="gst_number">
        <mat-error
          *ngIf="addVendorForm.get('gst_number')?.hasError('required') && addVendorForm.get('gst_number')?.touched">
          GST Number is required
        </mat-error>
        <mat-error
          *ngIf="addVendorForm.get('gst_number')?.hasError('pattern') && addVendorForm.get('gst_number')?.touched">
          Invalid GST Number format
        </mat-error>
      </mat-form-field>
    </div>




  </form>
  <mat-dialog-actions align="end" class="col-12 mt-3">
    <button mat-raised-button color="primary" (click)="onSubmit()" [disabled]="addVendorForm.invalid">Submit</button>

  </mat-dialog-actions>
</mat-dialog-content>
