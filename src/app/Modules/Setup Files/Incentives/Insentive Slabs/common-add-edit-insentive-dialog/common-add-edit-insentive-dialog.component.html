<h2 mat-dialog-title>{{ dialogTitle }}</h2>

<mat-dialog-content>
    <form [formGroup]="addIncentiveSlabForm" class="row g-3">   
        <!-- Project Selection -->
        <div class="col-md-6 mb-3">
            <app-autocomplete-reusable-component 
                formControlName="project_id" 
                [options]="projectsList"
                idKey="project_id" 
                displayKey="property_name" 
                placeholder="Select Project*"
                (selectedIdChange)="onProjectChange($event)">
            </app-autocomplete-reusable-component>
        </div>

        <!-- Wing Selection -->
        <div class="col-md-6 mb-3">
            <mat-form-field appearance="outline" class="w-100">
                <mat-label>Select Wing(s)</mat-label>
                <mat-select formControlName="wing_id" [disabled]="!allWingslist.length" multiple>
                    <mat-option *ngFor="let wing of allWingslist" [value]="wing.wing_id">
                        {{ wing.wing_name }}
                    </mat-option>
                </mat-select>
                <mat-hint *ngIf="allWingslist.length && incentiveType === 'role-wise'">You can select multiple wings</mat-hint>
            </mat-form-field>
        </div>

        <!-- Percentage From (Only for Slab Type) -->
        <div class="col-md-6 mb-3" *ngIf="incentiveType === 'slab'">
            <mat-form-field appearance="outline" class="w-100">
                <mat-label>Percentage From (%)*</mat-label>
                <input matInput type="number" formControlName="percentage_from" min="0" max="100" required>
                <mat-error>Percentage From is required</mat-error>
            </mat-form-field>
        </div>

        <!-- Percentage To (Only for Slab Type) -->
        <div class="col-md-6 mb-3" *ngIf="incentiveType === 'slab'">
            <mat-form-field appearance="outline" class="w-100">
                <mat-label>Percentage To (%)*</mat-label>
                <input matInput type="number" formControlName="percentage_to" min="0" max="100" required>
                <mat-error>Percentage To is required</mat-error>
            </mat-form-field>
        </div>

        <!-- Role Selection (Only for Role-Wise Type) -->
        <div class="col-md-6 mb-3" *ngIf="incentiveType === 'role-wise'">
            <mat-form-field appearance="outline" class="w-100">
                <mat-label>Role*</mat-label>
                <mat-select formControlName="role_id" required>
                    <mat-option *ngFor="let role of allRoleList" [value]="role.role_id">
                        {{ role.role }}
                    </mat-option>
                </mat-select>
                <mat-error *ngIf="addIncentiveSlabForm.get('role_id')?.hasError('required')">
                    Role is required
                </mat-error>
            </mat-form-field>
        </div>

        <!-- Incentive Percentage -->
        <div [ngClass]="incentiveType === 'role-wise' ? 'col-md-6' : 'col-md-12'" class="mb-3">
            <mat-form-field appearance="outline" class="w-100">
                <mat-label>Incentive Percentage (%)*</mat-label>
                <input matInput type="number" formControlName="incentive_percentage" min="0" max="100" step="0.01" required>
                <mat-error>Incentive Percentage is required</mat-error>
            </mat-form-field>
        </div>
    </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-button (click)="dialogRef.close(false)" [disabled]="loading">Cancel</button>
    <button mat-raised-button color="primary" (click)="onSubmit()" [disabled]="loading || addIncentiveSlabForm.invalid">
        <mat-spinner diameter="20" *ngIf="loading" class="d-inline-block me-2"></mat-spinner>
        {{ isEditMode ? 'Update' : 'Add' }}
    </button>
</mat-dialog-actions>
