<app-template>
    <app-breadcrumb>
        <li class="breadcrumb-item active">Global Aminities</li>
    </app-breadcrumb>

    <mat-accordion>
        <mat-expansion-panel hideToggle [expanded]="true">
            <mat-expansion-panel-header>
                <mat-panel-title>Advanced Filters</mat-panel-title>
            </mat-expansion-panel-header>

            <form [formGroup]="bookingForm" class="row">
                <!-- Project Dropdown -->
                <div class="col-md-3">
                    <app-autocomplete-reusable-component [options]="projectsList()" formControlName="project_id"
                        displayKey="property_name" [isMultiSelect]="true" idKey="project_id"
                        placeholder="Select Project">
                    </app-autocomplete-reusable-component>
                </div>

                <!-- Wing Dropdown -->
                <div class="col-md-3">
                    <mat-form-field appearance="outline" class="w-100">
                        <mat-label>Select Wing</mat-label>
                        <mat-select formControlName="wing_id">
                            <mat-option *ngFor="let wing of allWingslist(); trackBy: trackByWingId"
                                [value]="wing.wing_id">
                                {{ wing.wing_name }}
                            </mat-option>
                        </mat-select>
                    </mat-form-field>
                </div>

                <!-- Apply Filter Button -->
                <div class="col-md-auto">
                    <button type="button" mat-raised-button color="primary" class="d-flex align-items-center w-100"
                        (click)="fetchAmenityList()">
                        <mat-icon class="me-1">filter_list</mat-icon> Apply Filter
                    </button>
                </div>
            </form>
        </mat-expansion-panel>
    </mat-accordion>

    <app-configurable-ag-grid-data [loading]="loading()" [columns]="agreementDetailsColumnsNames"
        [apiEndpoint]="'fetch_amenity'" [apiMethod]="'POST'" [apiPayload]="agGridPayload()"
        [headerButtons]="headerButtons" [actions]="amenityActions" (actionClick)="onAmenityAction($event.action, $event.row)">
    </app-configurable-ag-grid-data>
</app-template>
