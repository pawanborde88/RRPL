<div class="floors-container">
  <div class="floors-header">
    <h2 class="floors-title">All Floors</h2>
    <div class="floors-controls">
      <button mat-raised-button color="primary" class="compact-btn" (click)="openFloorUnitDialog('add')">
         Add Floor
      </button>
    </div>
  </div>

  <div class="floors-content">
    <ng-container *ngIf="allFloorUnits.length > 0; else nofloorTemplate">
      <div class="floors-grid">
        <div *ngFor="let floor of allFloorUnits" class="floor-card-wrapper">
          <mat-card class="floor-card" [class.active-floor]="floor.active_status_id === 1"
            (click)="openFloorUnitDialog('edit', floor)">
            <div class="floor-header">
              <h3 class="floor-name">{{ floor.floor_name }}</h3>
              <span class="floor-status" [class.active]="floor.active_status_id === 1"
                [class.inactive]="floor.active_status_id !== 1">
                {{ floor.active_status_id === 1 ? 'Active' : 'Inactive' }}
              </span>
            </div>
            <div class="floor-details">
              <span class="floor-wing">{{ floor.wing_name || 'Not specified' }}</span>
            </div>
          </mat-card>
        </div>
      </div>
    </ng-container>

    <ng-template #nofloorTemplate>
      <div class="floors-empty">
        <div class="empty-content">
          <h4>No Floors Available</h4>
          <button mat-button color="primary" (click)="openFloorUnitDialog('add')">
            + Add Floor
          </button>
        </div>
      </div>
    </ng-template>
  </div>
</div>
