<h2 mat-dialog-title>{{ data.rowData[0].property_name }} Land Owners
  <button mat-icon-button mat-dialog-close style="position: absolute; top: 10px; right: 12px;">
    <mat-icon>close</mat-icon>
  </button>
</h2>

<mat-dialog-content>
  <!-- Form for adding/editing land owners -->
  <form *ngIf="isAddLandOwner" [formGroup]="landOwnerForm" (ngSubmit)="onSubmit()" class="row mt-1 land-owner-form">
    <mat-form-field appearance="outline" class="col-md-4">
      <mat-label>Land Owner Name</mat-label>
      <input matInput formControlName="land_owner_name" required placeholder="Enter Land Owner Name">
      <mat-error *ngIf="landOwnerForm.get('land_owner_name')?.hasError('required')">
        Land owner name is required
      </mat-error>
    </mat-form-field>

    <div class="col-md-4">
      <!-- Show Cancel/Update when editing -->
      <div *ngIf="isEditing" class="edit-actions" style="margin-top: 5px;">
        <button mat-button type="button" (click)="cancelEdit()">Cancel</button>
        <button mat-raised-button color="primary" type="submit" [disabled]="loading">
          <span *ngIf="!loading">Update</span>
          <mat-spinner *ngIf="loading" diameter="20"></mat-spinner>
        </button>
      </div>

      <!-- Show Add New button when not editing -->
      <div *ngIf="!isEditing" style="margin-top: 5px;">
        <button mat-raised-button color="primary" type="submit" [disabled]="loading">
          <span *ngIf="!loading">Add</span>
          <mat-spinner *ngIf="loading" diameter="20"></mat-spinner>
        </button>
      </div>
    </div>
  </form>

  <!-- Table showing existing land owners -->
  <div class="table-container">
    <app-reusable-custom-table 
      [loading]="loading" 
      [headerButtons]="headerButtons"
      [dataSource]="dataSource" 
      [displayedColumns]="displayedColumns"
      [actions]="projectActions" 
      [showFooter]="true" 
      (actionClick)="onProjectAction($event.action, $event.row)">
    </app-reusable-custom-table>
  </div>
</mat-dialog-content>
