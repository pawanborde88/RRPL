<app-template>
  <app-breadcrumb>
    <li class="breadcrumb-item active">All Brokerage Slabs</li>
  </app-breadcrumb>


  <form [formGroup]="myForm" class="row ">
    <app-autocomplete-reusable-component class="col-md-4" [options]="projectsList" formControlName="project_id"
      displayKey="property_name" idKey="project_id" placeholder="Select Project">
    </app-autocomplete-reusable-component>
  </form>


  <app-reusable-custom-table [loading]="loading" [dataSource]="dataSource" [displayedColumns]="displayedColumns"
    [actions]="projectActions" [showFooter]="true" (actionClick)="onProjectAction($event.action, $event.row)"
    [headerButtons]="headerButtons">
  </app-reusable-custom-table>


</app-template>
