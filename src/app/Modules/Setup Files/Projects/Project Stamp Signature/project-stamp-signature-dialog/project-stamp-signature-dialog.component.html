<h2 mat-dialog-title class="!m-0 !py-3 !px-4 text-lg font-semibold border-b border-gray-100">{{ data.title || 'Manage Stamp/Signature' }}
    <button mat-icon-button mat-dialog-close style="position: absolute; top: 6px; right: 8px;">
        <mat-icon>close</mat-icon>
    </button>
</h2>
<mat-dialog-content>
    <form [formGroup]="stampSignatureForm" (ngSubmit)="onSubmit()">
        <div class="image-upload-section">
            <h6 class="text-sm font-medium mb-1.5">Project Stamp</h6>
            <div class="image-preview" *ngIf="existingStamp">
                <div class="image-container">
                    <img [src]="existingStamp" alt="Current Stamp" class="preview-image">
                    <button type="button" mat-icon-button color="warn" class="delete-btn !w-8 !h-8 !leading-8" (click)="removeImage('stamp')"
                        matTooltip="Remove stamp">
                        <mat-icon class="!text-lg">delete</mat-icon>
                    </button>
                </div>
            </div>
            <div class="upload-control">
                <input type="file" id="stampUpload" (change)="onFileSelected($event, 'project_stamp')" accept="image/*"
                    hidden>
                <div class="flex items-center gap-3">
                    <label for="stampUpload" mat-flat-button color="primary" class="upload-btn !h-8 !px-3 !text-xs">
                        <mat-icon class="!text-base !w-4 !h-4 !mr-1">upload</mat-icon>
                        {{ existingStamp ? 'Change' : 'Upload' }}
                    </label>
                    <small class="file-hint text-xs text-gray-500">(JPG/PNG, <2MB)</small>
                </div>
            </div>
        </div>

        <!-- Project Signature Section -->
        <div class="image-upload-section">
            <h6 class="text-sm font-medium mb-1.5">Project Signature</h6>
            <div class="image-preview" *ngIf="existingSignature">
                <div class="image-container">
                    <img [src]="existingSignature" alt="Current Signature" class="preview-image">
                    <button type="button" mat-icon-button color="warn" class="delete-btn !w-8 !h-8 !leading-8"
                        (click)="removeImage('signature')" matTooltip="Remove signature">
                        <mat-icon class="!text-lg">delete</mat-icon>
                    </button>
                </div>
            </div>
            <div class="upload-control">
                <input type="file" id="signatureUpload" (change)="onFileSelected($event, 'project_signature')"
                    accept="image/*" hidden>
                <div class="flex items-center gap-3">
                    <label for="signatureUpload" mat-flat-button color="primary" class="upload-btn !h-8 !px-3 !text-xs">
                        <mat-icon class="!text-base !w-4 !h-4 !mr-1">upload</mat-icon>
                        {{ existingSignature ? 'Change' : 'Upload' }}
                    </label>
                    <small class="file-hint text-xs text-gray-500">(JPG/PNG, <2MB)</small>
                </div>
            </div>
        </div>
    </form>
</mat-dialog-content>
<mat-dialog-actions align="end" class="!min-h-0 !p-3 !border-t border-gray-100">
    <button mat-flat-button color="primary" (click)="onSubmit()" class="!h-9 !px-6 text-sm">
        <span *ngIf="!loading">{{ isEditing ? 'Update' : 'Save' }}</span>
        <mat-spinner *ngIf="loading" diameter="18"></mat-spinner>
    </button>
</mat-dialog-actions>
