<h2 mat-dialog-title>{{ data.title || 'Manage Stamp/Signature' }}
        <button mat-icon-button mat-dialog-close style="position: absolute; top: 10px; right: 12px;">
        <mat-icon>close</mat-icon>
    </button>
</h2>
<mat-dialog-content>
    <form [formGroup]="stampSignatureForm" (ngSubmit)="onSubmit()">
        <!-- Project Stamp Section -->
        <div class="image-upload-section">
            <h3>Project Stamp</h3>
            <div class="image-preview" *ngIf="existingStamp">
                <div class="image-container">
                    <img [src]="existingStamp" alt="Current Stamp" class="preview-image">
                    <button type="button" mat-icon-button color="warn" class="delete-btn" (click)="removeImage('stamp')"
                        matTooltip="Remove stamp">
                        <mat-icon>delete</mat-icon>
                    </button>
                </div>
            </div>
            <div class="upload-control">
                <input type="file" id="stampUpload" (change)="onFileSelected($event, 'project_stamp')" accept="image/*"
                    hidden>
                <label for="stampUpload" mat-raised-button color="primary" class="upload-btn">
                    <mat-icon>upload</mat-icon>
                    {{ existingStamp ? 'Change Stamp' : 'Upload Stamp' }}
                </label>
                <small class="file-hint">(JPG, PNG, max 2MB)</small>
            </div>
        </div>

        <!-- Project Signature Section -->
        <div class="image-upload-section">
            <h3>Project Signature</h3>
            <div class="image-preview" *ngIf="existingSignature">
                <div class="image-container">
                    <img [src]="existingSignature" alt="Current Signature" class="preview-image">
                    <button type="button" mat-icon-button color="warn" class="delete-btn"
                        (click)="removeImage('signature')" matTooltip="Remove signature">
                        <mat-icon>delete</mat-icon>
                    </button>
                </div>
            </div>
            <div class="upload-control">
                <input type="file" id="signatureUpload" (change)="onFileSelected($event, 'project_signature')"
                    accept="image/*" hidden>
                <label for="signatureUpload" mat-raised-button color="primary" class="upload-btn">
                    <mat-icon>upload</mat-icon>
                    {{ existingSignature ? 'Change Signature' : 'Upload Signature' }}
                </label>
                <small class="file-hint">(JPG, PNG, max 2MB)</small>
            </div>
        </div>
    </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
    <button mat-raised-button color="primary" (click)="onSubmit()" >
        <span *ngIf="!loading">{{ isEditing ? 'Update' : 'Save' }}</span>
        <mat-spinner *ngIf="loading" diameter="20"></mat-spinner>
    </button>
</mat-dialog-actions>
