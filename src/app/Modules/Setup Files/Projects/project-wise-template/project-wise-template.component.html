<h4 mat-dialog-title>
  <span>{{data.rowData[0].property_name}} Project Templates</span>

  <!-- Card View only: removed toggle buttons for table/card switch -->
  <button mat-icon-button mat-dialog-close style="position: absolute; top: 10px; right: 12px;">
    <mat-icon>close</mat-icon>
  </button>
</h4>

<mat-dialog-content>
  <div class="flex-1 overflow-y-auto">
    <div class="mb-6 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
      <div class="relative w-full sm:w-80">
        <mat-icon class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">search</mat-icon>
        <input type="text"
          class="h-10 w-full rounded-lg border border-slate-300 bg-white py-2 pl-10 pr-10 text-sm text-slate-700 placeholder-slate-400 shadow-sm transition focus:border-primary-500 focus:outline-none focus:ring-1 focus:ring-primary-500"
          placeholder="Search modules..." [(ngModel)]="searchTerm" />
        <button *ngIf="searchTerm" (click)="searchTerm = ''"
          class="absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
          <mat-icon class="text-lg">close</mat-icon>
        </button>
      </div>
    </div>

    <div *ngIf="!loading; else loadingState">
      <ng-container *ngIf="filteredTemplates.length; else emptyState">
        <div class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
          <div *ngFor="let module of filteredTemplates; trackBy: trackByModuleId"
            class="group relative flex flex-col rounded-xl border border-slate-200 bg-white p-4 shadow-sm transition hover:-translate-y-1 hover:shadow-md">
            <div class="mb-3 flex items-start justify-between">
              <div class="flex h-10 w-10 items-center justify-center rounded-lg bg-primary-50 text-primary-600">
                <mat-icon>folder_open</mat-icon>
              </div>
              <div class="flex items-center gap-1">
                <button mat-icon-button class="h-8 w-8 text-primary-600 hover:bg-primary-50" *ngIf="module.file"
                  (click)="downloadFile(module)" matTooltip="Download Template">
                  <mat-icon class="text-lg">download</mat-icon>
                </button>
              </div>
            </div>

            <h5 class="mb-1 text-base font-semibold text-slate-800 line-clamp-1">
              {{ module.module_name }}
            </h5>
            <p class="mb-4 text-xs text-slate-500">
              {{ module.file ? 'Template available' : 'No template uploaded' }}
            </p>

            <div class="mt-auto space-y-3 border-t border-slate-100 pt-3">
              <div class="flex items-center gap-2 rounded-md bg-slate-50 px-3 py-2 text-xs text-slate-600"
                [class.text-slate-400]="!module.file">
                <mat-icon class="text-base">description</mat-icon>
                <span class="truncate font-medium">
                  {{ getFileName(module.file) || 'No file selected' }}
                </span>
              </div>

              <input type="file" #fileInput class="hidden" (change)="onFileSelected($event, module.module_id)"
                accept=".html,.htm,.docx,.doc" />

              <button mat-flat-button color="primary" class="w-full rounded-lg" (click)="fileInput.click()">
                <div class="flex items-center justify-center gap-2">
                  <mat-icon class="text-lg">cloud_upload</mat-icon>
                  <span>Upload File</span>
                </div>
              </button>
            </div>
          </div>
        </div>
      </ng-container>
    </div>

    <ng-template #emptyState>
      <div
        class="flex h-64 flex-col items-center justify-center rounded-xl border-2 border-dashed border-slate-200 bg-slate-50 text-center">
        <div class="mb-4 flex h-16 w-16 items-center justify-center rounded-full bg-white shadow-sm">
          <mat-icon class="text-3xl text-slate-400">search_off</mat-icon>
        </div>
        <h3 class="text-lg font-medium text-slate-700">No templates found</h3>
        <p class="text-sm text-slate-500">Try adjusting your search criteria</p>
      </div>
    </ng-template>

    <ng-template #loadingState>
      <div class="flex h-64 w-full flex-col items-center justify-center">
        <app-costom-loading [loading]="loading" [text]="'Loading projects...'"></app-costom-loading>
      </div>
    </ng-template>
  </div>
</mat-dialog-content>
