<h2 mat-dialog-title class="flex items-center justify-between !mb-0 !py-4 !px-6 bg-slate-50 border-b border-slate-100">
  <div class="flex items-center gap-2">
    <mat-icon class="text-indigo-600">location_on</mat-icon>
    <span class="text-lg font-bold text-slate-800">Nearby Locations</span>
  </div>

</h2>

<mat-dialog-content class="!p-0">
  <form [formGroup]="locationForm" class="p-6">
    <div class="space-y-4 max-h-[60vh] overflow-y-auto pr-1 custom-scrollbar">

      <!-- Area List -->
      <div formArrayName="area" class="space-y-3">
        @for (group of area.controls; track $index; let i = $index) {
        <div [formGroupName]="i"
          class="group relative p-4 bg-white border border-slate-200 rounded-xl hover:border-indigo-300 hover:shadow-sm transition-all duration-200">

          <!-- Row Header -->
          <div class="flex items-center justify-between mb-3 border-b border-slate-50 pb-2">
            <div class="flex items-center gap-2">
              <span
                class="flex items-center justify-center w-5 h-5 rounded-full bg-indigo-50 text-indigo-600 text-[10px] font-bold">
                {{ i + 1 }}
              </span>
              <span class="text-[11px] font-bold text-slate-400 uppercase tracking-tight">Location Details</span>
            </div>
            @if (area.length > 1) {
            <button type="button" (click)="removeArea(i)"
              class="p-1 text-slate-300 hover:text-red-500 hover:bg-red-50 rounded-md transition-all">
              <mat-icon class="!w-4 !h-4 !text-[18px]">delete_outline</mat-icon>
            </button>
            }
          </div>

          <!-- Inputs Grid -->
          <div class="flex flex-col sm:flex-row gap-3">
            <!-- Location -->
            <div class="flex-1 space-y-1">
              <div class="relative group/input">
                <mat-icon
                  class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-300 group-focus-within/input:text-indigo-500 transition-colors !w-4 !h-4 !text-[16px]">place</mat-icon>
                <input type="text" formControlName="near_by_area" placeholder="Nearby Area / Landmark"
                  class="w-full pl-9 pr-4 py-2 bg-slate-50/50 border border-slate-200 rounded-lg text-sm focus:bg-white focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/5 transition-all outline-none placeholder:text-slate-400">
              </div>
            </div>

            <!-- Distance -->
            <div class="w-full sm:w-40 space-y-1">
              <div class="relative group/input">
                <mat-icon
                  class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-300 group-focus-within/input:text-indigo-500 transition-colors !w-4 !h-4 !text-[16px]">directions_car</mat-icon>
                <input type="text" formControlName="distance" placeholder="Distance (e.g. 5 km)"
                  class="w-full pl-9 pr-4 py-2 bg-slate-50/50 border border-slate-200 rounded-lg text-sm focus:bg-white focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/5 transition-all outline-none placeholder:text-slate-400">
              </div>
            </div>
          </div>
        </div>
        }
      </div>

      <!-- Compact Add Button -->
      <button type="button" (click)="addArea()"
        class="w-full py-2.5 border-2 border-dashed border-slate-100 rounded-xl text-slate-400 hover:border-indigo-200 hover:text-indigo-500 hover:bg-indigo-50/30 transition-all duration-200 flex items-center justify-center gap-2 group">
        <mat-icon class="!w-4 !h-4 !text-[18px] group-hover:scale-110 transition-transform">add</mat-icon>
        <span class="text-xs font-bold uppercase tracking-wide">Add Another Location</span>
      </button>

    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end" class="!px-6 !py-4 border-t border-slate-50 bg-slate-50/50">
  <button mat-button mat-dialog-close class="!text-slate-500 !font-bold hover:!bg-slate-100 !px-6 !py-2.5 !rounded-xl">
    Cancel
  </button>
  <button type="submit" mat-flat-button color="primary" (click)="onSubmit()"
    [disabled]="locationForm.invalid || loading"
    class="!bg-indigo-600 !text-white !font-bold !px-8 !py-2.5 !rounded-xl !shadow-lg !shadow-indigo-200 hover:!bg-indigo-700 disabled:!opacity-50 transition-all flex items-center gap-2">
    @if (!loading) {
    <span>Save All Locations</span>
    } @else {
    <div class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
    <span>Saving...</span>
    }
  </button>
</mat-dialog-actions>
