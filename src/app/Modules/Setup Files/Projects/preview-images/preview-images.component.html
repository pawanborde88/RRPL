<!-- Dialog Header with clean white background -->
<div class="dialog-header flex items-center justify-between px-6 py-4 border-b border-gray-200/50 bg-white shadow-sm sticky top-0 z-50">
  <h2 class="text-xl font-semibold m-0 text-blue-900">{{ data.title }}</h2>
  <button 
    mat-icon-button 
    mat-dialog-close 
    class="!w-10 !h-10 hover:!bg-gray-100 !transition-all !duration-200 flex items-center justify-center rounded-full"
    aria-label="Close dialog">
    <mat-icon class="!text-gray-600">close</mat-icon>
  </button>
</div>

<!-- Dialog Content with clean white background -->
<mat-dialog-content class="!p-0 !m-0 overflow-hidden bg-white">
  <!-- Use signals for reactive state management -->
  <div *ngIf="selectedImage() as selectedImage" class="relative w-full h-full bg-white">
    
    <!-- Main Image Display Container with clean light background -->
    <div class="image-display-container relative bg-gradient-to-br from-white via-gray-50/30 to-blue-50/20 w-full border-b border-gray-200/50 min-h-[250px] max-h-[400px] sm:min-h-[280px] sm:max-h-[450px] md:min-h-[300px] md:max-h-[500px] flex items-center justify-center overflow-hidden">
      
      <!-- Main Image with improved display and proper background -->
      <div class="relative w-full h-full flex items-center justify-center p-2 sm:p-3 md:p-4 bg-white">
        <img 
          [src]="selectedImage | imageUrl: storageUrl" 
          class="block max-w-[50%] max-h-[50%] w-auto h-auto object-contain rounded-lg shadow-xl ring-1 ring-gray-300/30 transition-all duration-300 ease-in-out bg-white"
          [class.opacity-0]="!imageLoaded()"
          [class.opacity-100]="imageLoaded()"
          [class.scale-95]="!imageLoaded()"
          [class.scale-100]="imageLoaded()"
          style="image-rendering: -webkit-optimize-contrast; image-rendering: crisp-edges; width: auto; height: auto;"
          alt="Selected image preview"
          (load)="onImageLoad()"
          loading="eager"
          draggable="false">
        
        <!-- Loading Spinner Overlay with white background -->
        <div 
          *ngIf="!imageLoaded()" 
          class="absolute inset-0 flex flex-col items-center justify-center bg-white z-10 rounded-lg">
          <mat-spinner diameter="50" class="primary-spinner mb-4"></mat-spinner>
          <p class="text-sm text-gray-600 font-medium animate-pulse">Loading image...</p>
        </div>
      </div>
      
      <!-- Image Counter Badge with modern glassmorphism design -->
      <div 
        *ngIf="hasMultipleImages()" 
        class="counter-badge absolute top-4 left-4 sm:top-5 sm:left-5 px-3 py-2 sm:px-4 sm:py-2 rounded-xl text-sm font-bold shadow-2xl z-20 backdrop-blur-lg bg-gradient-to-r from-blue-600/90 to-blue-700/90 border border-white/20 ring-1 ring-black/5">
        <span class="text-white drop-shadow-lg">{{ currentImageIndex() + 1 }}</span>
        <span class="text-white/80 mx-1.5 drop-shadow-lg">/</span>
        <span class="text-white/90 drop-shadow-lg">{{ images().length }}</span>
      </div>
      
      <!-- Navigation Arrows with enhanced styling -->
      <div *ngIf="hasMultipleImages()" class="absolute inset-0 flex items-center justify-between px-2 sm:px-4 md:px-6 pointer-events-none z-20">
        <button 
          mat-mini-fab 
          class="nav-button pointer-events-auto !shadow-2xl !transition-all !duration-300 hover:!scale-110 active:!scale-95 !border-0 !backdrop-blur-md !bg-gradient-to-br !from-blue-600 !to-blue-700 hover:!from-blue-700 hover:!to-blue-800 !ring-2 !ring-white/30"
          (click)="navigateImages('prev')" 
          [disabled]="false"
          matTooltip="Previous (←)"
          matTooltipPosition="right"
          aria-label="Previous image">
          <mat-icon class="!text-white drop-shadow-lg">chevron_left</mat-icon>
        </button>
        
        <button 
          mat-mini-fab 
          class="nav-button pointer-events-auto !shadow-2xl !transition-all !duration-300 hover:!scale-110 active:!scale-95 !border-0 !backdrop-blur-md !bg-gradient-to-br !from-blue-600 !to-blue-700 hover:!from-blue-700 hover:!to-blue-800 !ring-2 !ring-white/30"
          (click)="navigateImages('next')" 
          [disabled]="false"
          matTooltip="Next (→)"
          matTooltipPosition="left"
          aria-label="Next image">
          <mat-icon class="!text-white drop-shadow-lg">chevron_right</mat-icon>
        </button>
      </div>

      <!-- Delete Button -->
      <div class="absolute top-4 right-4 sm:top-5 sm:right-5 flex gap-2 sm:gap-3 z-20">
        <button
          *ngIf="canDeleteCurrentImage() && currentProjectImageId()"
          mat-mini-fab
          class="delete-button !shadow-2xl !transition-all !duration-300 hover:!scale-110 active:!scale-95 !border-0 !backdrop-blur-md !bg-gradient-to-br !from-red-600 !to-red-700 hover:!from-red-700 hover:!to-red-800 !ring-2 !ring-white/30"
          (click)="deleteProjectImage(currentProjectImageId()!)"
          matTooltip="Delete Image"
          matTooltipPosition="left"
          aria-label="Delete image">
          <mat-icon class="!text-white drop-shadow-lg">delete</mat-icon>
        </button>
      </div>
    </div>
  </div>
</mat-dialog-content>

<!-- Action Buttons Section -->
<mat-dialog-actions class="!p-4 !m-0 !justify-end border-t border-gray-200/50 bg-white">
  <button
    mat-raised-button
    color="primary"
    class="download-button !shadow-lg !transition-all !duration-300 hover:!scale-105 active:!scale-95 !bg-green-600 hover:!bg-green-700"
    (click)="downloadImage()"
    aria-label="Download image">
    <mat-icon>download</mat-icon>
    <span class="ml-2">Download Image</span>
  </button>
</mat-dialog-actions>

<!-- Thumbnail Gallery Footer with clean styling -->
<mat-dialog-actions *ngIf="hasMultipleImages()" class="!p-0 !m-0 !block border-t border-gray-200/50 bg-white">
  <div class="w-full bg-white">
    <div class="relative px-12 sm:px-14 py-4 sm:py-5">
      
      <!-- Previous Scroll Button with enhanced design -->
      <button 
        mat-icon-button 
        class="scroll-nav-btn !absolute left-1 sm:left-2 top-1/2 -translate-y-1/2 z-10 !bg-white !shadow-lg hover:!shadow-xl hover:!bg-blue-50 !transition-all !duration-300 disabled:!opacity-20 disabled:!cursor-not-allowed disabled:hover:!bg-white !w-9 !h-9 sm:!w-10 sm:!h-10 !rounded-full !border-2 !border-gray-200 hover:!border-blue-400 active:!scale-95"
        (click)="scroll('left')" 
        [disabled]="!scrollState().canScrollLeft" 
        matTooltip="Scroll thumbnails left"
        aria-label="Scroll left">
        <mat-icon class="!text-gray-700 hover:!text-blue-600 !transition-colors">chevron_left</mat-icon>
      </button>

      <!-- Scrollable Thumbnails Container with improved styling -->
      <div 
        #scrollContainer 
        class="flex gap-2 sm:gap-3 overflow-x-auto overflow-y-hidden scroll-smooth hide-scrollbar py-1"
        (scroll)="onScroll()"
        style="scrollbar-width: none; -ms-overflow-style: none; scroll-behavior: smooth;">
        
        <!-- Use trackBy for optimal ngFor performance -->
        <div 
          *ngFor="let image of images(); let i = index; trackBy: trackByImage" 
          class="flex-shrink-0">
          
          <div
            class="thumbnail-card group relative rounded-xl overflow-hidden cursor-pointer transition-all duration-300 bg-white border-2 border-gray-200 hover:border-blue-300 hover:shadow-xl w-20 h-20 sm:w-24 sm:h-24"
            [class.selected]="isImageSelected(image)"
            [class.ring-4]="isImageSelected(image)"
            [class.ring-blue-500]="isImageSelected(image)"
            [class.ring-offset-2]="isImageSelected(image)"
            [class.shadow-2xl]="isImageSelected(image)"
            [class.scale-105]="isImageSelected(image)"
            (click)="viewImage(getResolvedImagePath(image))">
            
            <!-- Thumbnail Image with lazy loading and better fit -->
            <img
              class="w-full h-full object-cover object-center transition-transform duration-300 group-hover:scale-110"
              [alt]="'Thumbnail ' + (i + 1)"
              [src]="getResolvedImagePath(image) | imageUrl: storageUrl"
              style="image-rendering: -webkit-optimize-contrast;"
              loading="lazy"
              draggable="false" />
            
            <!-- Image Number Badge with glassmorphism -->
            <div 
              class="thumbnail-number absolute bottom-1 right-1 sm:bottom-1.5 sm:right-1.5 backdrop-blur-md bg-gradient-to-br from-blue-600/90 to-blue-700/90 text-white text-xs font-bold rounded-full flex items-center justify-center shadow-lg border border-white/30 transition-transform duration-300 group-hover:scale-110 w-5 h-5 sm:w-6 sm:h-6">
              <span class="drop-shadow-md text-[10px] sm:text-xs">{{ i + 1 }}</span>
            </div>
            
            <!-- Selected Indicator Overlay with gradient -->
            <div 
              *ngIf="isImageSelected(image)"
              class="selected-overlay absolute inset-0 pointer-events-none rounded-xl bg-gradient-to-t from-blue-600/30 via-transparent to-transparent border-2 border-blue-500">
              <div class="absolute top-2 left-2 bg-blue-600 rounded-full p-1 shadow-lg">
                <mat-icon class="!text-white !text-sm !w-4 !h-4 !leading-4">check</mat-icon>
              </div>
            </div>
            
            <!-- Hover overlay for unselected images -->
            <div 
              *ngIf="!isImageSelected(image)"
              class="absolute inset-0 pointer-events-none rounded-xl bg-blue-600/0 group-hover:bg-blue-600/10 transition-colors duration-300">
            </div>
          </div>
        </div>
      </div>

      <!-- Next Scroll Button with enhanced design -->
      <button 
        mat-icon-button 
        class="scroll-nav-btn !absolute right-1 sm:right-2 top-1/2 -translate-y-1/2 z-10 !bg-white !shadow-lg hover:!shadow-xl hover:!bg-blue-50 !transition-all !duration-300 disabled:!opacity-20 disabled:!cursor-not-allowed disabled:hover:!bg-white !w-9 !h-9 sm:!w-10 sm:!h-10 !rounded-full !border-2 !border-gray-200 hover:!border-blue-400 active:!scale-95"
        (click)="scroll('right')" 
        [disabled]="!scrollState().canScrollRight" 
        matTooltip="Scroll thumbnails right"
        aria-label="Scroll right">
        <mat-icon class="!text-gray-700 hover:!text-blue-600 !transition-colors">chevron_right</mat-icon>
      </button>
    </div>
  </div>
</mat-dialog-actions>
