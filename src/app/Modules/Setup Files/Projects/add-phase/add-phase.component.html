<h2 mat-dialog-title>{{ data.title }} 
    <button mat-icon-button mat-dialog-close style="position: absolute; top: 10px; right: 12px;">
        <mat-icon>close</mat-icon>
    </button>
</h2>


<mat-dialog-content class="mat-typography">
    <mat-card-content>
        <form [formGroup]="addPhase" class="row">
            <mat-form-field appearance="outline" class="col-md-4">
                <mat-label>Title</mat-label>
                <input matInput formControlName="phase_name" />
            </mat-form-field>
            <mat-form-field appearance="outline" class="col-md-4">
                <mat-label>Rera No</mat-label>
                <input matInput formControlName="rera_no" />
            </mat-form-field>
            <mat-form-field appearance="outline" class="col-md-4">
                <mat-label>sequence</mat-label>
                <input matInput formControlName="sequence" />
            </mat-form-field>
            <div class="col-md-4">
                <mat-form-field appearance="outline" class="w-100">
                    <mat-label>Start Date</mat-label>
                    <input matInput formControlName="start_date" [matDatepicker]="picker"
                        placeholder="Select Date" />
                    <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
                    <mat-datepicker #picker></mat-datepicker>
                </mat-form-field>
            </div>
            <div class="col-md-4">
                <mat-form-field appearance="outline" class="w-100">
                    <mat-label>Launch Date</mat-label>
                    <input matInput formControlName="launch_date" [matDatepicker]="launchDate"
                        placeholder="Select Date" />
                    <mat-datepicker-toggle matSuffix [for]="launchDate"></mat-datepicker-toggle>
                    <mat-datepicker #launchDate></mat-datepicker>
                </mat-form-field>
            </div>
            <mat-form-field appearance="outline" class="col-md-4">
                <mat-label>Active Status</mat-label>
                <mat-select formControlName="active_status_id">
                    <mat-option [value]="1">Active</mat-option>
                    <mat-option [value]="0">Inactive</mat-option>
                </mat-select>
            </mat-form-field>
        </form>
    </mat-card-content>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button *ngIf="this.data?.rowData?.phase_id" mat-icon-button color="warn"
        (click)="$event.stopPropagation(); deletePhase(this.data.rowData.phase_id)">
        <mat-icon>delete</mat-icon>
    </button>
    <button mat-raised-button color="primary" (click)="onSubmit()">Submit</button>

</mat-dialog-actions>
