<h2 mat-dialog-title>{{ data.title }}
    <button mat-icon-button mat-dialog-close style="position: absolute; top: 10px; right: 12px;">
        <mat-icon>close</mat-icon>
    </button>
</h2>
<mat-dialog-content class="mat-typography">


    <form [formGroup]="addPreffedLocation" class="row g-3 mt-1 align-items-center">
        <div class="row">

            <mat-form-field appearance="outline" class="col-md-12">
                <mat-label>Preferred Location</mat-label>
                <input matInput formControlName="preferred_location" />
            </mat-form-field>


        </div>


        <mat-dialog-actions align="end">
            <button mat-raised-button color="primary" (click)="onSubmit()" type="submit">Save</button>
        </mat-dialog-actions>
    </form>

</mat-dialog-content>
