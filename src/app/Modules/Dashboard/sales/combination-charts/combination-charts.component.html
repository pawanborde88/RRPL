<div class="container text-center">
    <h2>Project Enquiries Report</h2>
  
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="filters d-flex align-items-center justify-content-center gap-3">
          <!-- Expense Date Range -->
          <div class="date-range-picker d-flex align-items-center">
            <label class="me-2">Expense Date Range:</label>
            <mat-form-field appearance="outline">
              <mat-date-range-input [rangePicker]="picker">
                <input matStartDate placeholder="Start date" [(ngModel)]="startDate">
                <input matEndDate placeholder="End date" [(ngModel)]="endDate">
              </mat-date-range-input>
              <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
              <mat-date-range-picker #picker></mat-date-range-picker>
            </mat-form-field>
          </div>
  
          <!-- Project Selection Dropdown -->
          <div class="project-selector d-flex align-items-center">
            <label class="me-2">Projects:</label>
            <app-autocomplete-reusable-component 
              [options]="availableProjects" 
              [(ngModel)]="selectedProjects"
              displayKey="project_name" 
              idKey="project_id" 
              placeholder="Select Project" 
              (inputChanged)="onProjectSelectionChange($event)">
            </app-autocomplete-reusable-component>
          </div>

          <!-- Filter Button -->
          <button class="btn btn-primary" (click)="onFilterChange()">Filter</button>
        </div>
      </div>
    </div>
  
    <!-- Chart -->
    <div class="row justify-content-center mt-3">
      <div class="col-md-10">
        <div class="chart-container">
          <canvas #chartCanvas></canvas>
        </div>
      </div>
    </div>
</div>
