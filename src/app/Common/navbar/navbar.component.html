<nav
  class="navbarStyle bg-white/80 backdrop-blur-md border-b border-slate-200/50 sticky top-0 z-[1000] w-full transition-all duration-500">
  <div class="px-3 sm:px-5 h-12 flex items-center justify-between mx-auto w-full">

    <!-- Left Section: Menu & Logo -->
    <div class="flex items-center gap-2 sm:gap-4">
      <button mat-icon-button
        class="!w-9 !h-9 sm:!w-10 sm:!h-10 !flex !items-center !justify-center rounded-xl bg-slate-100/80 hover:bg-white hover:shadow-sm ring-1 ring-slate-200/50 transition-all duration-300 group"
        (click)="toggleSidebar()" [matTooltip]="sidebarTooltip()" matTooltipPosition="below">
        <mat-icon class="text-slate-600 group-hover:text-blue-600 transition-colors !text-[20px] sm:!text-[22px]">
          {{ sidebarIcon() }}
        </mat-icon>
      </button>

      <div class="flex items-center pl-1">
        <img *ngIf="logoUrl() as logo" [src]="logo"
          class="h-6 lg:h-7 w-auto object-contain drop-shadow-sm transition-transform duration-500 hover:scale-[1.03]"
          alt="Logo" />
      </div>
    </div>


    <!-- Right Section: Actions & Profile -->
    <div class="flex items-center gap-1.5 sm:gap-3">

      <!-- Star -->

      <!-- Tasks -->


      <!-- Leaderboard / Rewarded Ads -->
      <button mat-icon-button
        class="!w-9 !h-9 rounded-xl relative hover:bg-slate-50 transition-all duration-300 ring-1 ring-transparent hover:ring-slate-200/50 group"
        matTooltip="Leaderboard" [routerLink]="['/setup/leaderboard']">
        <mat-icon class="text-slate-600 !text-[22px]">verified_user</mat-icon>
        <span
          class="absolute -top-1 -right-1 flex items-center justify-center min-w-[18px] h-[18px] px-1 text-[9px] font-bold text-white bg-amber-600 rounded-full ring-2 ring-white shadow-sm">
          3
        </span>
      </button>

      <!-- Notifications -->
      <div class="relative group notification-container">
        <button mat-icon-button
          class="notification-btn !w-9 !h-9 rounded-xl relative hover:bg-slate-50 transition-all duration-300 ring-1 ring-transparent hover:ring-slate-200/50"
          matTooltip="Notifications" (click)="toggleNotifications($event)">
          <mat-icon class="text-slate-600 !text-[22px]">notifications</mat-icon>
          <span *ngIf="notificationCount() > 0"
            class="badge-pulse absolute -top-1 -right-1 flex items-center justify-center min-w-[18px] h-[18px] px-1 text-[9px] font-bold text-white bg-sky-900 rounded-full ring-2 ring-white shadow-sm">
            {{ notificationCount() }}
          </span>
        </button>

        <!-- Notification Panel (Hover/Click) -->
        <div
          class="absolute right-0 top-full pt-2 invisible opacity-0 translate-y-2 group-hover:visible group-hover:opacity-100 group-hover:translate-y-0 transition-all duration-300 transform z-[1010]"
          [class.!visible]="isNotificationOpen()" [class.!opacity-100]="isNotificationOpen()"
          [class.!translate-y-0]="isNotificationOpen()">
          <app-notification-panel
            class="block shadow-2xl rounded-2xl overflow-hidden border border-slate-200/60"></app-notification-panel>
        </div>
      </div>

      <!-- Vertical Divider -->
      <div class="h-6 w-px bg-slate-200/60 mx-1 hidden sm:block"></div>

      <!-- Profile Trigger -->
      <button [matMenuTriggerFor]="profileMenu"
        class="profile-trigger flex items-center p-1 rounded-xl hover:bg-slate-50 transition-all duration-300 outline-none group  border-transparent hover:border-slate-200/50"
        [matTooltip]="'Profile Settings'">
        <div class="relative flex-shrink-0">
          <img
            class="w-7.5 h-7.5 rounded-lg object-cover ring-1 ring-slate-200/80 shadow-sm transition-all duration-300 group-hover:ring-blue-400 group-hover:scale-[1.05]"
            [src]="profileImageUrl()" (error)="onImageError($event)" alt="User">
          <div class="absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 bg-green-500 border-2 border-white rounded-full">
          </div>
        </div>
        <div class="hidden md:flex flex-col items-start ml-2 mr-1">
          <span
            class="text-[11px] font-bold text-slate-800 leading-none mb-0.5 group-hover:text-blue-600 transition-colors">{{
            userFullName() }}</span>
        </div>
        <mat-icon
          class="hidden md:block text-slate-400 !text-[14px] !w-4 !h-4 transition-transform duration-300 group-hover:translate-y-0.5">expand_more</mat-icon>
      </button>

      <!-- Advanced Profile Menu -->
      <mat-menu #profileMenu="matMenu" class="modern-profile-menu" xPosition="before" [overlapTrigger]="false">
        <div class="w-[260px] p-0 focus:outline-none overflow-hidden">
          <!-- Profile Header -->
          <div class="p-4 bg-sky-900 relative">
            <div
              class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')] opacity-10 pointer-events-none">
            </div>
            <div class="flex items-center gap-3.5 relative z-10">
              <div class="relative">
                <img class="w-11 h-11 rounded-xl object-cover ring-2 ring-white/20 shadow-xl" [src]="profileImageUrl()"
                  (error)="onImageError($event)" alt="Profile" />
                <div
                  class="absolute -bottom-0.5 -right-0.5 w-3.5 h-3.5 bg-green-500 border-2 border-slate-900 rounded-full">
                </div>
              </div>
              <div class="flex flex-col min-w-0">
                <span class="text-[13px] font-bold text-white truncate leading-tight">{{ userFullName() }}</span>
                <span class="text-[10px] text-slate-400 font-medium truncate mt-0.5" *ngIf="roleName() as role">{{ role
                  }}</span>
              </div>
            </div>
          </div>

          <!-- Organization Info -->
          <div *ngIf="partner()" class="px-4 py-2 bg-slate-50/80 border-b border-slate-100 flex items-center gap-2">
            <div class="w-1 h-3 bg-blue-500 rounded-full"></div>
            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest truncate">{{ partner() }}</span>
          </div>

          <!-- Menu Options -->
          <div class="p-1.5 space-y-0.5">
            <button mat-menu-item [routerLink]="['/profile']" class="modern-menu-item group rounded-lg">
              <div class="flex items-center gap-3">
                <div
                  class="w-7 h-7 flex items-center justify-center rounded-lg bg-slate-50 group-hover:bg-blue-50 group-hover:scale-110 transition-all">
                  <mat-icon
                    class="text-slate-500 group-hover:text-blue-500 !text-[15px] !w-[15px] !h-[15px]">person_outline</mat-icon>
                </div>
                <div class="flex flex-col">
                  <span class="text-[12px] font-bold text-slate-700 leading-tight">My Profile</span>
                  <span class="text-[9px] text-slate-400 group-hover:text-slate-500 leading-tight">View details</span>
                </div>
              </div>
            </button>

            <button mat-menu-item (click)="openChangePasswordDialog()" class="modern-menu-item group rounded-lg">
              <div class="flex items-center gap-3">
                <div
                  class="w-7 h-7 flex items-center justify-center rounded-lg bg-slate-50 group-hover:bg-orange-50 group-hover:scale-110 transition-all">
                  <mat-icon
                    class="text-slate-500 group-hover:text-orange-500 !text-[15px] !w-[15px] !h-[15px]">key</mat-icon>
                </div>
                <div class="flex flex-col">
                  <span class="text-[12px] font-bold text-slate-700 leading-tight">Security</span>
                  <span class="text-[9px] text-slate-400 group-hover:text-slate-500 leading-tight">Update
                    password</span>
                </div>
              </div>
            </button>

            <button *ngIf="hasAdminAccess()" mat-menu-item [routerLink]="['/settings']"
              class="modern-menu-item group rounded-lg">
              <div class="flex items-center gap-3">
                <div
                  class="w-7 h-7 flex items-center justify-center rounded-lg bg-slate-50 group-hover:bg-purple-50 group-hover:scale-110 transition-all">
                  <mat-icon
                    class="text-slate-500 group-hover:text-purple-500 !text-[15px] !w-[15px] !h-[15px]">settings</mat-icon>
                </div>
                <div class="flex flex-col">
                  <span class="text-[12px] font-bold text-slate-700 leading-tight">Settings</span>
                  <span class="text-[9px] text-slate-400 group-hover:text-slate-500 leading-tight">Configurations</span>
                </div>
              </div>
            </button>
          </div>

          <div class="mt-1 p-1.5 border-t border-slate-100 bg-slate-50/30">
            <button mat-menu-item (click)="logout()" class="modern-menu-item group rounded-lg hover:!bg-red-50">
              <div class="flex items-center gap-3">
                <div
                  class="w-7 h-7 flex items-center justify-center rounded-lg bg-red-50 group-hover:bg-red-100 group-hover:rotate-12 transition-all">
                  <mat-icon
                    class="text-red-500 group-hover:text-red-600 !text-[15px] !w-[15px] !h-[15px]">power_settings_new</mat-icon>
                </div>
                <span class="text-[12px] font-bold text-red-600 group-hover:text-red-700">Logout</span>
              </div>
            </button>
          </div>
        </div>
      </mat-menu>
    </div>
  </div>
</nav>
