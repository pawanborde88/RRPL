<div class="main-container">
    <!-- Mobile Backdrop -->
    <div class="sidebar-backdrop" 
         [class.visible]="isSidebarExpanded()" 
         (click)="toggleSidebar()">
    </div>

    <!-- Full-height Sidebar on the left -->
    <div class="sidebar-wrapper" [ngClass]="sidebarClass()">
        <app-sidebar></app-sidebar>
    </div>

    <!-- Right side container (navbar + content + footer) -->
    <div class="right-side-container" [ngClass]="sidebarClass()">

        <!-- Navbar at top of right side -->
        <app-navbar class="navbar-fixed"></app-navbar>

        <!-- Main content area (scrollable) -->
        <div class="main-content container-fluid rounded-2 content-area ">

            <ng-content></ng-content>

        </div>

        <!-- Footer at bottom of right side -->
        <app-footer class="footer-fixed"></app-footer>
    </div>
</div>
